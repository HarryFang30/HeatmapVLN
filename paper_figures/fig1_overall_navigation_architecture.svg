  <rect x="1480" y="145" width="420" height="198" rx="14" fill="#F0F8EC" stroke="#669B4B" stroke-width="1.9"/>
  <rect x="1504" y="164" width="74" height="23" rx="11" fill="#FFFFFF" stroke="#93BA80"/>
  <text x="1541" y="180" text-anchor="middle" class="badge" fill="#487235">FROZEN</text>
  <text x="1690" y="207" text-anchor="middle" class="module-title">NextDiT trajectory diffusion</text>
  <text x="1690" y="233" text-anchor="middle" class="module-sub">native attention residual</text>
  <rect x="1520" y="258" width="340" height="55" rx="9" fill="#E7F6F2" stroke="#218779" stroke-width="1.6"/>
  <text x="1690" y="281" text-anchor="middle" class="tiny" fill="#176B60">ZERO-GATED CROSS-ATTENTION IN EACH BLOCK</text>
  <text x="1690" y="301" text-anchor="middle" class="small" fill="#176B60">independent residual before each native FFN</text>
  <rect x="1733" y="266" width="104" height="22" rx="10" fill="#218779"/>
  <text x="1785" y="281" text-anchor="middle" class="badge" fill="#FFFFFF">TRAINABLE</text>

