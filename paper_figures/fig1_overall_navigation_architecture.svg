<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="980" viewBox="0 0 2200 980" role="img" aria-labelledby="title desc">
  <title id="title">Overall Navigation Architecture with AMB3R-Conditioned Heatmap Guidance</title>
  <desc id="desc">The preserved InternNav System-2 to System-1 backbone is augmented with a causal AMB3R pose sidecar, a front-view trajectory-guided heatmap head, a structured tokenizer, and a zero-gated cross-attention branch in every frozen NextDiT block.</desc>

  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #1F2933; }
      .group-title { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #FFFFFF; letter-spacing: .2px; }
      .module-title { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; fill: #24313A; }
      .module-sub { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; fill: #52616B; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 400; fill: #64727C; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 600; fill: #52616B; letter-spacing: .2px; }
      .badge { font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: .7px; }
      .view-label { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 700; fill: #4C5963; }
      .flow-label { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 600; fill: #52616B; }
    </style>

    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4E5B64"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D98532"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4E91C4"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#218779"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A9298"/>
    </marker>

    <symbol id="frame-front" viewBox="0 0 80 54">
      <rect x="1" y="1" width="78" height="52" rx="6" fill="#E9F1F3" stroke="#7A9199" stroke-width="1.2"/>
      <path d="M2 53 L24 28 L58 28 L78 53 Z" fill="#CEB79C"/>
      <path d="M2 2 L24 28 L24 53 L2 53 Z" fill="#CCDEE4"/>
      <path d="M78 2 L58 28 L58 53 L78 53 Z" fill="#E6D3BF"/>
      <rect x="34" y="8" width="16" height="21" rx="2" fill="#73909B"/>
      <rect x="37" y="11" width="10" height="15" fill="#B9D8E1"/>
      <path d="M41 29 V53 M24 28 L2 40 M58 28 L78 40" fill="none" stroke="#9E836C" stroke-width="1"/>
    </symbol>

    <symbol id="heatmap" viewBox="0 0 54 54">
      <rect x="1" y="1" width="52" height="52" rx="6" fill="#17212B" stroke="#55707A" stroke-width="1.1"/>
      <circle cx="34" cy="22" r="15" fill="#6C2F35" opacity=".72"/>
      <circle cx="34" cy="22" r="10" fill="#D25A32" opacity=".88"/>
      <circle cx="34" cy="22" r="6" fill="#F0A83A"/>
      <circle cx="34" cy="22" r="2.7" fill="#FFF3A5"/>
    </symbol>

    <symbol id="pose-path" viewBox="0 0 92 58">
      <rect x="1" y="1" width="90" height="56" rx="7" fill="#F7FBFE" stroke="#9DBFD7" stroke-width="1"/>
      <path d="M15 44 C25 38, 24 24, 37 25 S53 45, 65 36 S70 18, 81 14" fill="none" stroke="#4E91C4" stroke-width="3" stroke-linecap="round"/>
      <circle cx="15" cy="44" r="4" fill="#A8CBE2"/>
