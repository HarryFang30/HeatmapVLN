seed: 42

# ============================================
# 阶段 2: System 1 适配（VLM + LoRA 完全冻结）
# ============================================
#
# 核心原则（对齐 InternNav 论文）:
#   InternNav Stage 1: 全参数微调 Qwen → 学 pixel-goal 生成
#   InternNav Stage 2: 冻结 Qwen → 只训 latent_queries + DiT
#
#   HeatmapVLN Stage 1: LoRA + 热力图头 → 学空间理解
#   HeatmapVLN Stage 2: 冻结 LoRA → 只训 System 1 组件
#
#   关键: 训练 System 1 时 VLM 表示必须是固定靶标，
#   否则 latent_queries 追逐一个不断变化的表示空间，无法收敛。
#
# 前置条件:
#   阶段 1 (train_heatmap_config.yaml) 已完成。
#
# 启动方式:
#   python scripts/train.py \
#     --config configs/train_config_internnav.yaml \
#     --load-weights /path/to/stage1/checkpoints/best.pth
#
# ============================================

# ============================================
# 数据配置
# ============================================
data:
  root: /workspace/r2r_panoramic_data
  train_split: train
  val_root: /workspace/val_unseen
  val_split: all
  image_size: [256, 256]
  init_hm_size: [64, 64]
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2

  dataset_type: trajectory

  sliding_window:
    min_history: 5
    num_history_sample: 8
    load_depth: true
    load_history_frames: false
    cache_poses: true
    sample_stride: 2
    defer_heatmap_to_gpu: false
    clip_level_sampling: true
    samples_per_clip: 15
    val_samples_per_clip: 5

  trajectory:
    min_history: 5
    num_history_sample: 8
    load_depth: true
    cache_poses: true
    sample_stride: 2
    clip_level_sampling: true
    samples_per_clip: 20
    val_samples_per_clip: 8
    random_subsequence: true
    min_subsequence_length: 30
    subsequence_samples_per_clip: 5
    predict_horizon: 32
    action_scale: 4.0
    enable_trajectory_augmentation: true
    use_subinstruction: true
    fgr2r_subinstr_path: ./data/fgr2r/subinstr_mapping.json.gz
    load_traj_images: true
    traj_image_size: [224, 224]

# ============================================
# 模型配置 — InternNav backbone (Qwen2.5-VL)
# ============================================
model:
  type: vln_pipeline
  device: cuda

  llm:
    model_path: ./models/internnav_backbone
    backbone_type: qwen2_5_vl
    hidden_dim: 3584
    token_dim: 896
    torch_dtype: bfloat16
    attn_implementation: sdpa
    max_video_frames: -1
    enable_packing: false
    max_seq_length: 8192
    spatial_merge_size: 2
    # LoRA 从 Stage 1 加载，Stage 2 中完全冻结
    use_lora: true
    lora_rank: 16
    lora_alpha: 32
    lora_layer_indices: [5, 6, 12, 13, 19, 20]
    lora_dropout: 0.05

  # HeatmapVLN v2 Coarse-to-Fine
  heatmap:
    enable: true
    c_vit: 1280
    c_llm: 3584
    c_fused: 256
    vit_layer_indices: [7, 15, 23, 31]
    llm_layer_indices: [6, 13, 20]
    heatmap_size: [64, 64]
    image_size: 256
    lambda_vis: 1.0
    lambda_coord: 0.2
    lambda_kl: 0.0
    lambda_peak: 1.0

    trajectory:
      enable: true
      num_freqs: 16
      d_attn: 256
      num_heads: 4
      num_layers: 2
      max_spatial_range: 10.0

  # NextDiT System 1 — 与 InternNav 完全一致
  action_head:
    enable: true
    nextdit:
      enabled: true
      vlm_hidden_dim: 3584
      latent_emb_size: 768
      n_query: 4
      dit_dim: 384
      dit_layers: 12
      dit_heads: 6
      dit_kv_heads: 6
      dit_ffn_dim_multiplier: 0.6666666666666666
      predict_steps: 32
      action_dim: 3
      num_inference_steps: 10
      guidance_scale: 1.0
      num_sample_trajs: 32
      dav2_ckpt_path: "models/depth_anything_v2_metric_hypersim_vits.pth"
      enable_gradient_checkpointing: true
      internnav_system1_path: "models/internnav_system1.safetensors"
      # 前 500 步只训 cond_projector + latent_queries
      # 之后解冻 memory_encoder / rgb_resampler
      warmup_steps: 500

# ============================================
# 训练策略 — 对齐 InternNav: 冻结 VLM，只训 System 1
# ============================================
#
# 对齐 InternNav 论文的核心设计:
#
#   InternNav Stage 2:
#     冻结: 整个 Qwen2.5-VL
#     训练: latent_queries + cond_projector + DiT + 视觉记忆
#
#   HeatmapVLN Stage 2 (本配置):
#     冻结: Qwen2.5-VL 基座 + LoRA (空间理解已固化)
#     训练: latent_queries + cond_projector + 视觉记忆
#     冻结: traj_dit (已从 InternNav 预训练，保持轨迹生成能力)
#     可选: heatmap_vln 继续训练 (在固定 VLM 特征上精炼，不影响 System 1)
#
#   为什么冻结 LoRA:
#     1. LoRA 是"空间理解增强器"，在 Stage 1 已训练完成
#     2. 如果 Stage 2 继续训练 LoRA，VLM 表示会不断变化
#     3. latent_queries 追逐一个移动靶标，无法稳定收敛
#     4. InternNav 论文已证明: 训练 System 1 时 VLM 必须冻结
#
#   为什么冻结 traj_dit:
#     traj_dit 来自 InternNav 预训练，已有良好的轨迹生成能力。
#     只需训练桥接层 (cond_projector + latent_queries) 适配新的 VLM 表示。
#     如果 trajectory loss 不收敛，可以尝试解冻 traj_dit。
#
training:
  stages:
    - name: stage2_system1_adaptation
      epochs: 10
      hm_size: [64, 64]
      heatmap_loss_type: heatmap_vln
      train_heatmap: true
      train_action: true
      trainable_modules:
        - latent_queries     # 核心: 学习从固定 VLM 表示中提取导航条件
        - cond_projector     # 核心: 3584→768 条件投影适配
        - memory_encoder     # 视觉记忆自注意力 (适配全景)
        - rgb_resampler      # QFormer 视觉记忆重采样 (适配全景)
        - llm_projector      # LLM hidden → token dim 桥接
        - heatmap_vln        # 可选: 在固定 VLM 特征上继续精炼热力图
      frozen_modules:
        - vlm_backbone       # Qwen2.5-VL 基座权重
        - lora               # 空间理解已固化，不再更新
        - traj_dit           # InternNav 预训练的核心扩散模型
        - rgb_model           # DINOv2/DepthAnythingV2 预训练视觉编码器
        - action_encoder     # 动作空间编码 (动作空间未变)
        - action_decoder     # 动作空间解码 (动作空间未变)
        - pos_encoding       # 正弦位置编码

# ============================================
# 优化器配置
# ============================================
#
# 学习率设计原则:
#   - LoRA: 不参与 (冻结)
#   - 桥接层 (latent_queries, cond_projector): 高 lr，主要训练对象
#   - 视觉记忆 (memory_encoder, rgb_resampler): 中等 lr
#   - HeatmapVLN: 低 lr，只做精炼 (VLM 特征已固定)
#
# 参考 InternNav Stage 2: lr=1e-4，轨迹相关组件统一学习率
#
optim:
  optimizer: adamw
  learning_rate: 1.0e-4
  heatmap_lr: 5.0e-5
  vis_head_lr: 2.0e-4
  nextdit_cond_projector_lr: 1.0e-4
  latent_queries_lr: 1.0e-4
  memory_encoder_lr: 1.0e-4
  rgb_resampler_lr: 1.0e-4
  llm_projector_lr: 5.0e-5
  weight_decay: 0.0
  grad_clip: 1.0
  amp: bf16
  scheduler: cosine
  warmup_ratio: 0.003
  min_lr: 1.0e-5
  batch_size: 4
  grad_accum_steps: 2

# ============================================
# 损失函数
# ============================================
#
# 轨迹为主导，热力图为辅助监控:
#   - trajectory_weight = 1.0: System 1 是主要训练目标
#   - heatmap_weight = 0.3: 热力图只是在固定 VLM 上精炼，
#     权重降低避免占用过多计算图；
#     热力图梯度不会流入 LoRA (已冻结)，不影响 System 1
#
loss:
  heatmap_loss_type: heatmap_vln

  heatmap_vln:
    lambda_vis: 1.0
    lambda_coord: 0.2
    lambda_kl: 0.0
    lambda_peak: 1.0
    lambda_neg: 1.0
    temperature: 1.0
    vis_pos_weight: 7.0
    temperature_schedule:
      enabled: false
      mode: cosine
      start: 1.0
      end: 1.0

  heatmap_weight: 0.3
  trajectory_weight: 1.0

# ============================================
# GPU配置
# ============================================
gpu:
  devices: [0]
  backend: nccl
  multi_gpu:
    enabled: false
    find_unused_parameters: false

# ============================================
# 日志与保存
# ============================================
log:
  out_dir: /root/autodl-tmp/vln_training_outputs
  save_every_epochs: 1
  vis_every_steps: 100
  val_vis_batches: 2
  max_ckpts: 5
  use_tensorboard: true
  tensorboard_dir: /root/tf-logs
  enable_timing: false
  epoch_boundary_cooldown_s: 8
  log_interval: 10
  show_gpu_memory: true
  tqdm_ncols: 120
  log_level: INFO
  diag_interval: 100
  mid_epoch_save_every: 500

  notify:
    enabled: true
    platform: feishu
    webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/60a6d820-9069-4963-8116-46bd68e668aa"

# ============================================
# 验证配置
# ============================================
validation:
  eval_every_epochs: 1
  save_best_metric: val_total_loss
  patience: 10
  val_inference_batches: 6
