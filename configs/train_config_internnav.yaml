seed: 42

# ============================================
# 阶段 2: System 1 选择性适配（VLM + LoRA 完全冻结）
# ============================================
#
# 核心原则: 只解冻输入真正变化了的组件
#
#   变化链:
#     LoRA 修改 VLM → traj_hidden_states 分布偏移
#     → cond_projector 需重新学习投影
#     → traj_cond 分布变化 → traj_dit 需适配新条件 + R2R 轨迹分布
#
#   不变链 (System 1 输入不变):
#     traj_images(前视图) → DINOv2(冻结) → memory_encoder → rgb_resampler
#     → 输入完全不变，无需训练 (~26M 参数省下)
#
#   VLM 输入:
#     panoramic_vlm_input=true → 4 张全景图 (与 Stage 1 heatmap 一致)
#     pixel_goal 坐标 = 前视图像素坐标 (prompt 明确指定 "前视图中的像素坐标")
#     → 消除 Stage 1/2 输入格式错配, LoRA 在同一格式下训练和使用
#
# 训练策略 (warmup → 选择性微调):
#   Warmup (前 500 步): 只训 cond_projector + latent_queries
#   Warmup 后: 加入 traj_dit 微调
#
# 前置条件:
#   阶段 1 (train_heatmap_config.yaml) 已完成，LoRA 空间理解已固化。
#
# 启动方式:
#   python scripts/train.py \
#     --config configs/train_config_internnav.yaml \
#     --load-weights /path/to/stage1/checkpoints/best.pth
#
# ============================================

# ============================================
# 数据配置
# ============================================
data:
  root: /workspace/r2r_panoramic_data
  train_split: train
  val_root: /workspace/val_unseen
  val_split: all
  image_size: [256, 256]
  init_hm_size: [64, 64]
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2

  dataset_type: trajectory

  sliding_window:
    min_history: 5
    num_history_sample: 8
    load_depth: true
    load_history_frames: false
    cache_poses: true
    sample_stride: 2
    defer_heatmap_to_gpu: false
    clip_level_sampling: true
    samples_per_clip: 15
    val_samples_per_clip: 5

  trajectory:
    # 全景图统一输入:
    #   panoramic_vlm_input=true → VLM 看到 4 张全景图 (与 Stage 1 一致)
    #   pixel_goal 坐标仍在前视图坐标系 (prompt: "前视图中的像素坐标")
    #   traj_images (System 1 DINOv2 输入) 不受影响，仍为前视图
    #
    # Token 数量: (num_history+1) × 4 views × ~81 tokens ≈ 2600
    # 较前视频方案增加约 3x 视觉 token，需减少 num_history 或 batch_size
    min_history: 5
    num_history_sample: 8
    panoramic_vlm_input: true
    load_depth: true
    cache_poses: true
    sample_stride: 2
    clip_level_sampling: true
    samples_per_clip: 20
    val_samples_per_clip: 8
    random_subsequence: true
    min_subsequence_length: 30
    subsequence_samples_per_clip: 5
    predict_horizon: 32
    action_scale: 4.0
    enable_trajectory_augmentation: true
    use_subinstruction: true
    fgr2r_subinstr_path: ./data/fgr2r/subinstr_mapping.json.gz
    load_traj_images: true
    traj_image_size: [224, 224]

# ============================================
# 模型配置 — InternNav backbone (Qwen2.5-VL)
# ============================================
model:
  type: vln_pipeline
  device: cuda

  llm:
    model_path: ./models/internnav_backbone
    backbone_type: qwen2_5_vl
    hidden_dim: 3584
    token_dim: 896
    torch_dtype: bfloat16
    attn_implementation: sdpa
    max_video_frames: -1
    gradient_checkpointing: true
    enable_packing: false
    max_seq_length: 8192
    spatial_merge_size: 2
    use_lora: true
    lora_rank: 16
    lora_alpha: 32
    lora_layer_indices: [5, 6, 12, 13, 19, 20]
    lora_dropout: 0.05

  heatmap:
    enable: true
    c_vit: 1280
    c_llm: 3584
    c_fused: 256
    vit_layer_indices: [7, 15, 23, 31]
    llm_layer_indices: [6, 13, 20]
    heatmap_size: [64, 64]
    image_size: 256
    lambda_vis: 1.0
    lambda_coord: 0.2
    lambda_kl: 0.0
    lambda_peak: 1.0

    trajectory:
      enable: true
      num_freqs: 16
      d_attn: 256
      num_heads: 4
      num_layers: 2
      max_spatial_range: 10.0

  # NextDiT System 1 — 从 InternNav 预训练权重初始化
  action_head:
    enable: true
    nextdit:
      enabled: true
      vlm_hidden_dim: 3584
      latent_emb_size: 768
      n_query: 4
      dit_dim: 384
      dit_layers: 12
      dit_heads: 6
      dit_kv_heads: 6
      dit_ffn_dim_multiplier: 0.6666666666666666
      predict_steps: 32
      action_dim: 3
      num_inference_steps: 10
      guidance_scale: 1.0
      num_sample_trajs: 32
      dav2_ckpt_path: "models/depth_anything_v2_metric_hypersim_vits.pth"
      enable_gradient_checkpointing: true
      internnav_system1_path: "models/internnav_system1.safetensors"
      # Warmup: 前 500 步只训桥接层 → 之后解冻 traj_dit
      warmup_steps: 500

# ============================================
# 训练策略 — 选择性解冻
# ============================================
#
# 数据流变化分析:
#   左支 (条件): traj_hidden_states → cond_projector → traj_cond
#     ↑ LoRA 改变了分布 → 必须训练
#
#   右支 (视觉记忆): traj_images → DINOv2 → memory_encoder → rgb_resampler
#     ↑ 前视图输入完全不变 → 无需训练 (省 ~26M 参数)
#
#   下游: traj_dit(cross-attn to [memory_tokens, traj_cond])
#     ↑ 4/36 条件 token 变了 + R2R 轨迹分布不同 → 应该微调
#
#   末端: action_encoder/decoder — 动作空间 (dx,dy,dheading) 不变 → 无需训练
#
training:
  stages:
    - name: stage2_selective_finetune
      epochs: 10
      hm_size: [64, 64]
      heatmap_loss_type: heatmap_vln
      # Stage 2 VLM 输入为全景图 (与 Stage 1 一致),
      # 仅训动作, heatmap loss 不参与 → train_heatmap 关闭
      train_heatmap: false
      train_history: false
      train_action: true
      trainable_modules:
        # 条件适配 (输入变了)
        - latent_queries     # 4×3584 = 14K params
        - cond_projector     # 3584→768→768 = ~3.3M params
        # 轨迹生成微调 (条件变了 + R2R 数据分布不同)
        - traj_dit           # 12层 DiT = ~21M params
      frozen_modules:
        - vlm_backbone       # Qwen2.5-VL 基座权重
        - lora               # 空间理解已固化
        # 视觉记忆 (输入不变，无需训练，省 ~26M 参数)
        - memory_encoder     # DINOv2 特征不变
        - rgb_resampler      # DINOv2 特征不变
        - rgb_model           # DINOv2 始终冻结
        # 动作空间 (不变)
        - action_encoder     # Linear(3→384)
        - action_decoder     # Linear(384→3)
        - pos_encoding       # 固定正弦编码
        - llm_projector      # 非轨迹路径

# ============================================
# 优化器配置
# ============================================
#
# 分层学习率:
#   桥接层:  1e-4 (最大适配幅度)
#   traj_dit: 5e-5 (预训练初始化，保守微调)
#
# 总可训练参数: ~24M (vs 全部解冻 ~51M，减少 53%)
#
optim:
  optimizer: adamw
  learning_rate: 1.0e-4
  heatmap_lr: 5.0e-5
  vis_head_lr: 2.0e-4
  # 桥接层: 最高学习率
  nextdit_cond_projector_lr: 1.0e-4
  latent_queries_lr: 1.0e-4
  # traj_dit: 较低学习率 (有预训练初始化)
  nextdit_action_lr: 5.0e-5
  weight_decay: 0.01
  grad_clip: 1.0
  amp: bf16
  scheduler: cosine
  warmup_ratio: 0.003
  min_lr: 1.0e-5
  # 全景输入: (8+1) × 4 views = 36 images/sample (原前视方案 11 images)
  # 48GB VRAM, gradient_checkpointing=true
  # 有效 batch = 8 × 8 = 64
  batch_size: 8
  grad_accum_steps: 8

# ============================================
# 损失函数
# ============================================
loss:
  heatmap_loss_type: heatmap_vln

  heatmap_vln:
    lambda_vis: 1.0
    lambda_coord: 0.2
    lambda_kl: 0.0
    lambda_peak: 1.0
    lambda_neg: 1.0
    temperature: 1.0
    vis_pos_weight: 7.0
    temperature_schedule:
      enabled: false
      mode: cosine
      start: 1.0
      end: 1.0

  heatmap_weight: 0.2
  trajectory_weight: 1.0

# ============================================
# GPU配置
# ============================================
gpu:
  devices: [0]
  backend: nccl
  multi_gpu:
    enabled: false
    find_unused_parameters: false

# ============================================
# 日志与保存
# ============================================
log:
  out_dir: /root/autodl-tmp/vln_training_outputs
  save_every_epochs: 1
  vis_every_steps: 100
  val_vis_batches: 2
  max_ckpts: 5
  use_tensorboard: true
  tensorboard_dir: /root/tf-logs
  enable_timing: false
  epoch_boundary_cooldown_s: 8
  log_interval: 10
  show_gpu_memory: true
  tqdm_ncols: 120
  log_level: INFO
  diag_interval: 100
  mid_epoch_save_every: 500

  notify:
    enabled: true
    platform: feishu
    webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/60a6d820-9069-4963-8116-46bd68e668aa"

# ============================================
# 验证配置
# ============================================
validation:
  eval_every_epochs: 1
  save_best_metric: val_total_loss
  patience: 10
  val_inference_batches: 6
