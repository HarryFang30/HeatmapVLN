seed: 42

# ============================================
# 阶段 2: System 1 桥接适配（VLM + LoRA 完全冻结）
# ============================================
#
# 对齐 InternNav 论文:
#   InternNav Stage 2: 冻结整个 Qwen → 只训 latent_queries + System 1
#   HeatmapVLN Stage 2: 冻结 Qwen + LoRA → 只训桥接层
#
# 与 InternNav 的关键区别:
#   - InternNav 从头训 System 1; 我们已有预训练的 System 1 权重
#   - System 1 的视觉记忆路径 (traj_images) 保持前视图输入，与 InternNav 一致
#   - 因此 traj_dit / memory_encoder / rgb_resampler 等不需要适配
#   - 只需训练 latent_queries + cond_projector 适配 LoRA 引入的表示偏移
#
# 前置条件:
#   阶段 1 (train_heatmap_config.yaml) 已完成，LoRA 空间理解已固化。
#
# 启动方式:
#   python scripts/train.py \
#     --config configs/train_config_internnav.yaml \
#     --load-weights /path/to/stage1/checkpoints/best.pth
#
# ============================================

# ============================================
# 数据配置
# ============================================
data:
  root: /workspace/r2r_panoramic_data
  train_split: train
  val_root: /workspace/val_unseen
  val_split: all
  image_size: [256, 256]
  init_hm_size: [64, 64]
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2

  dataset_type: trajectory

  sliding_window:
    min_history: 5
    num_history_sample: 8
    load_depth: true
    load_history_frames: false
    cache_poses: true
    sample_stride: 2
    defer_heatmap_to_gpu: false
    clip_level_sampling: true
    samples_per_clip: 15
    val_samples_per_clip: 5

  trajectory:
    min_history: 5
    num_history_sample: 8
    load_depth: true
    cache_poses: true
    sample_stride: 2
    clip_level_sampling: true
    samples_per_clip: 20
    val_samples_per_clip: 8
    random_subsequence: true
    min_subsequence_length: 30
    subsequence_samples_per_clip: 5
    predict_horizon: 32
    action_scale: 4.0
    enable_trajectory_augmentation: true
    use_subinstruction: true
    fgr2r_subinstr_path: ./data/fgr2r/subinstr_mapping.json.gz
    # System 1 视觉记忆: 仅前视图，与 InternNav 一致
    load_traj_images: true
    traj_image_size: [224, 224]

# ============================================
# 模型配置 — InternNav backbone (Qwen2.5-VL)
# ============================================
model:
  type: vln_pipeline
  device: cuda

  llm:
    model_path: ./models/internnav_backbone
    backbone_type: qwen2_5_vl
    hidden_dim: 3584
    token_dim: 896
    torch_dtype: bfloat16
    attn_implementation: sdpa
    max_video_frames: -1
    enable_packing: false
    max_seq_length: 8192
    spatial_merge_size: 2
    # LoRA 从 Stage 1 加载，Stage 2 中完全冻结
    use_lora: true
    lora_rank: 16
    lora_alpha: 32
    lora_layer_indices: [5, 6, 12, 13, 19, 20]
    lora_dropout: 0.05

  # HeatmapVLN v2 (可选: 在固定 VLM 上继续精炼)
  heatmap:
    enable: true
    c_vit: 1280
    c_llm: 3584
    c_fused: 256
    vit_layer_indices: [7, 15, 23, 31]
    llm_layer_indices: [6, 13, 20]
    heatmap_size: [64, 64]
    image_size: 256
    lambda_vis: 1.0
    lambda_coord: 0.2
    lambda_kl: 0.0
    lambda_peak: 1.0

    trajectory:
      enable: true
      num_freqs: 16
      d_attn: 256
      num_heads: 4
      num_layers: 2
      max_spatial_range: 10.0

  # NextDiT System 1 — 预训练权重，与 InternNav 完全一致
  action_head:
    enable: true
    nextdit:
      enabled: true
      vlm_hidden_dim: 3584
      latent_emb_size: 768
      n_query: 4
      dit_dim: 384
      dit_layers: 12
      dit_heads: 6
      dit_kv_heads: 6
      dit_ffn_dim_multiplier: 0.6666666666666666
      predict_steps: 32
      action_dim: 3
      num_inference_steps: 10
      guidance_scale: 1.0
      num_sample_trajs: 32
      dav2_ckpt_path: "models/depth_anything_v2_metric_hypersim_vits.pth"
      enable_gradient_checkpointing: true
      internnav_system1_path: "models/internnav_system1.safetensors"
      warmup_steps: 0

# ============================================
# 训练策略 — 只训桥接层
# ============================================
#
# 分析:
#   VLM 变化: Qwen 基座相同，LoRA 引入了空间理解增强
#   → traj_hidden_states 分布偏移（LoRA 修改了 LLM 层的 attention）
#   → cond_projector 需重新学习 3584→768 投影
#   → latent_queries 需重新学习条件提取
#
#   System 1 不变: traj_images = 前视图（与 InternNav 一致）
#   → memory_encoder / rgb_resampler / traj_dit 无需适配
#   → 整个 System 1 核心保持冻结
#
training:
  stages:
    - name: stage2_bridge_only
      epochs: 10
      hm_size: [64, 64]
      heatmap_loss_type: heatmap_vln
      train_heatmap: true
      train_action: true
      trainable_modules:
        - latent_queries     # 适配 LoRA 修改后的 LLM 表示
        - cond_projector     # 重新学习 3584→768 投影
        - heatmap_vln        # 可选: 在固定 VLM 上精炼热力图
      frozen_modules:
        - vlm_backbone       # Qwen2.5-VL 基座权重
        - lora               # 空间理解已固化
        - traj_dit           # 预训练轨迹生成 (输入格式不变)
        - memory_encoder     # 前视图输入不变，无需适配
        - rgb_resampler      # 前视图输入不变，无需适配
        - rgb_model           # DINOv2 预训练
        - action_encoder     # 动作空间不变
        - action_decoder     # 动作空间不变
        - pos_encoding       # 正弦位置编码
        - llm_projector      # 非轨迹关键路径

# ============================================
# 优化器配置
# ============================================
#
# 参考 InternNav Stage 2: lr=1e-4, weight_decay=0
#
# 只有两组核心参数:
#   - latent_queries: 4 × 3584 = 14336 参数
#   - cond_projector: ~5.5M 参数 (3584→768→768)
# 总可训练参数极少，收敛应很快
#
optim:
  optimizer: adamw
  learning_rate: 1.0e-4
  heatmap_lr: 5.0e-5
  vis_head_lr: 2.0e-4
  nextdit_cond_projector_lr: 1.0e-4
  latent_queries_lr: 1.0e-4
  weight_decay: 0.0
  grad_clip: 1.0
  amp: bf16
  scheduler: cosine
  warmup_ratio: 0.003
  min_lr: 1.0e-5
  batch_size: 4
  grad_accum_steps: 2

# ============================================
# 损失函数
# ============================================
#
# trajectory_weight = 1.0: 桥接适配的主目标
# heatmap_weight = 0.3: 可选监控，梯度不影响桥接层
#   (LoRA 冻结 → 热力图梯度止于 heatmap_vln 模块，不碰 System 1)
#
loss:
  heatmap_loss_type: heatmap_vln

  heatmap_vln:
    lambda_vis: 1.0
    lambda_coord: 0.2
    lambda_kl: 0.0
    lambda_peak: 1.0
    lambda_neg: 1.0
    temperature: 1.0
    vis_pos_weight: 7.0
    temperature_schedule:
      enabled: false
      mode: cosine
      start: 1.0
      end: 1.0

  heatmap_weight: 0.3
  trajectory_weight: 1.0

# ============================================
# GPU配置
# ============================================
gpu:
  devices: [0]
  backend: nccl
  multi_gpu:
    enabled: false
    find_unused_parameters: false

# ============================================
# 日志与保存
# ============================================
log:
  out_dir: /root/autodl-tmp/vln_training_outputs
  save_every_epochs: 1
  vis_every_steps: 100
  val_vis_batches: 2
  max_ckpts: 5
  use_tensorboard: true
  tensorboard_dir: /root/tf-logs
  enable_timing: false
  epoch_boundary_cooldown_s: 8
  log_interval: 10
  show_gpu_memory: true
  tqdm_ncols: 120
  log_level: INFO
  diag_interval: 100
  mid_epoch_save_every: 500

  notify:
    enabled: true
    platform: feishu
    webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/60a6d820-9069-4963-8116-46bd68e668aa"

# ============================================
# 验证配置
# ============================================
validation:
  eval_every_epochs: 1
  save_best_metric: val_total_loss
  patience: 10
  val_inference_batches: 6
