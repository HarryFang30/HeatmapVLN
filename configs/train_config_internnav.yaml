seed: 42

# ============================================
# 阶段 2: System 1 全面适配（VLM + LoRA 完全冻结）
# ============================================
#
# 对齐 InternNav Stage 2:
#   冻结 VLM → 训练整个 System 1
#
# 与 InternNav 的关键区别:
#   - InternNav 从头训 System 1; 我们用 InternNav 预训练权重作初始化
#   - 有预训练权重 → 可以用更低学习率 + warmup 稳定微调
#   - System 1 视觉记忆 (traj_images) 保持前视图，与 InternNav 一致
#
# 训练策略 (warmup → 全面微调):
#   Step 1 (warmup, 前 500 步):
#     只训 cond_projector + latent_queries
#     → 让桥接层先适配 LoRA 修改后的 VLM 表示
#     → 此时 traj_dit 等核心模块冻结，避免条件不稳定导致崩溃
#   Step 2 (warmup 后):
#     解冻整个 System 1 (除 DINOv2)
#     → traj_dit 用较低学习率微调，适应新条件分布和 R2R 数据
#     → memory_encoder / rgb_resampler 适应新的视觉特征
#
# 前置条件:
#   阶段 1 (train_heatmap_config.yaml) 已完成，LoRA 空间理解已固化。
#
# 启动方式:
#   python scripts/train.py \
#     --config configs/train_config_internnav.yaml \
#     --load-weights /path/to/stage1/checkpoints/best.pth
#
# ============================================

# ============================================
# 数据配置
# ============================================
data:
  root: /workspace/r2r_panoramic_data
  train_split: train
  val_root: /workspace/val_unseen
  val_split: all
  image_size: [256, 256]
  init_hm_size: [64, 64]
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2

  dataset_type: trajectory

  sliding_window:
    min_history: 5
    num_history_sample: 8
    load_depth: true
    load_history_frames: false
    cache_poses: true
    sample_stride: 2
    defer_heatmap_to_gpu: false
    clip_level_sampling: true
    samples_per_clip: 15
    val_samples_per_clip: 5

  trajectory:
    min_history: 5
    num_history_sample: 8
    load_depth: true
    cache_poses: true
    sample_stride: 2
    clip_level_sampling: true
    samples_per_clip: 20
    val_samples_per_clip: 8
    random_subsequence: true
    min_subsequence_length: 30
    subsequence_samples_per_clip: 5
    predict_horizon: 32
    action_scale: 4.0
    enable_trajectory_augmentation: true
    use_subinstruction: true
    fgr2r_subinstr_path: ./data/fgr2r/subinstr_mapping.json.gz
    load_traj_images: true
    traj_image_size: [224, 224]

# ============================================
# 模型配置 — InternNav backbone (Qwen2.5-VL)
# ============================================
model:
  type: vln_pipeline
  device: cuda

  llm:
    model_path: ./models/internnav_backbone
    backbone_type: qwen2_5_vl
    hidden_dim: 3584
    token_dim: 896
    torch_dtype: bfloat16
    attn_implementation: sdpa
    max_video_frames: -1
    enable_packing: false
    max_seq_length: 8192
    spatial_merge_size: 2
    use_lora: true
    lora_rank: 16
    lora_alpha: 32
    lora_layer_indices: [5, 6, 12, 13, 19, 20]
    lora_dropout: 0.05

  heatmap:
    enable: true
    c_vit: 1280
    c_llm: 3584
    c_fused: 256
    vit_layer_indices: [7, 15, 23, 31]
    llm_layer_indices: [6, 13, 20]
    heatmap_size: [64, 64]
    image_size: 256
    lambda_vis: 1.0
    lambda_coord: 0.2
    lambda_kl: 0.0
    lambda_peak: 1.0

    trajectory:
      enable: true
      num_freqs: 16
      d_attn: 256
      num_heads: 4
      num_layers: 2
      max_spatial_range: 10.0

  # NextDiT System 1 — 从 InternNav 预训练权重初始化，然后全面微调
  action_head:
    enable: true
    nextdit:
      enabled: true
      vlm_hidden_dim: 3584
      latent_emb_size: 768
      n_query: 4
      dit_dim: 384
      dit_layers: 12
      dit_heads: 6
      dit_kv_heads: 6
      dit_ffn_dim_multiplier: 0.6666666666666666
      predict_steps: 32
      action_dim: 3
      num_inference_steps: 10
      guidance_scale: 1.0
      num_sample_trajs: 32
      dav2_ckpt_path: "models/depth_anything_v2_metric_hypersim_vits.pth"
      enable_gradient_checkpointing: true
      internnav_system1_path: "models/internnav_system1.safetensors"
      # Warmup: 前 500 步只训 cond_projector + latent_queries，
      # 之后解冻整个 System 1 (end_nextdit_warmup)
      warmup_steps: 500

# ============================================
# 训练策略 — warmup + 全面 System 1 微调
# ============================================
#
# Warmup 阶段 (前 500 步):
#   可训练: cond_projector + latent_queries
#   冻结:   traj_dit, memory_encoder, rgb_resampler, ...
#   目的:   先让桥接层稳定适配 LoRA 修改后的表示
#
# Warmup 后:
#   可训练: 整个 nextdit_action_head (除 rgb_model)
#   目的:   traj_dit 在稳定条件下微调，适应 R2R 轨迹分布
#
# 全程冻结:
#   VLM backbone + LoRA (空间理解已固化)
#   rgb_model (DINOv2 预训练)
#
training:
  stages:
    - name: stage2_system1_finetune
      epochs: 10
      hm_size: [64, 64]
      heatmap_loss_type: heatmap_vln
      train_heatmap: true
      train_action: true
      trainable_modules:
        - nextdit_action_head  # 整个 System 1 (rgb_model 自动保持冻结)
        - latent_queries       # 适配 LoRA 修改后的 LLM 表示
        - heatmap_vln          # 在固定 VLM 上继续精炼热力图
      frozen_modules:
        - vlm_backbone         # Qwen2.5-VL 基座权重
        - lora                 # 空间理解已固化
        - rgb_model            # DINOv2 始终冻结
        - llm_projector        # 非轨迹关键路径

# ============================================
# 优化器配置
# ============================================
#
# 分层学习率策略:
#   - 桥接层 (cond_projector, latent_queries): 1e-4
#     → 需要最大幅度的适配 (VLM 表示偏移)
#   - System 1 核心 (traj_dit 等): 5e-5
#     → 已有良好初始化，微调即可，避免遗忘
#   - memory_encoder / rgb_resampler: 5e-5
#     → 虽然输入格式不变，但数据分布有差异
#   - heatmap: 5e-5
#     → 在固定 VLM 特征上低速精炼
#
optim:
  optimizer: adamw
  learning_rate: 1.0e-4
  heatmap_lr: 5.0e-5
  vis_head_lr: 2.0e-4
  # 桥接层: 最高学习率 (需要最大适配)
  nextdit_cond_projector_lr: 1.0e-4
  latent_queries_lr: 1.0e-4
  # System 1 核心: 较低学习率 (有预训练初始化)
  nextdit_action_lr: 5.0e-5
  memory_encoder_lr: 5.0e-5
  rgb_resampler_lr: 5.0e-5
  weight_decay: 0.0
  grad_clip: 1.0
  amp: bf16
  scheduler: cosine
  warmup_ratio: 0.003
  min_lr: 1.0e-5
  batch_size: 4
  grad_accum_steps: 2

# ============================================
# 损失函数
# ============================================
#
# trajectory_weight = 1.0: 主目标
# heatmap_weight = 0.2: 辅助监控
#   (LoRA 冻结 → 热力图梯度止于 heatmap_vln 模块，不碰 System 1)
#
loss:
  heatmap_loss_type: heatmap_vln

  heatmap_vln:
    lambda_vis: 1.0
    lambda_coord: 0.2
    lambda_kl: 0.0
    lambda_peak: 1.0
    lambda_neg: 1.0
    temperature: 1.0
    vis_pos_weight: 7.0
    temperature_schedule:
      enabled: false
      mode: cosine
      start: 1.0
      end: 1.0

  heatmap_weight: 0.2
  trajectory_weight: 1.0

# ============================================
# GPU配置
# ============================================
gpu:
  devices: [0]
  backend: nccl
  multi_gpu:
    enabled: false
    find_unused_parameters: false

# ============================================
# 日志与保存
# ============================================
log:
  out_dir: /root/autodl-tmp/vln_training_outputs
  save_every_epochs: 1
  vis_every_steps: 100
  val_vis_batches: 2
  max_ckpts: 5
  use_tensorboard: true
  tensorboard_dir: /root/tf-logs
  enable_timing: false
  epoch_boundary_cooldown_s: 8
  log_interval: 10
  show_gpu_memory: true
  tqdm_ncols: 120
  log_level: INFO
  diag_interval: 100
  mid_epoch_save_every: 500

  notify:
    enabled: true
    platform: feishu
    webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/60a6d820-9069-4963-8116-46bd68e668aa"

# ============================================
# 验证配置
# ============================================
validation:
  eval_every_epochs: 1
  save_best_metric: val_total_loss
  patience: 10
  val_inference_batches: 6
