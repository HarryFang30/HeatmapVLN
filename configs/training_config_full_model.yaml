seed: 42

# ============================================
# 数据配置
# ============================================
data:
  root: /root/autodl-tmp/dataset_with_actions
  image_size: [224, 224]
  init_hm_size: [64, 64]                # 起始分辨率
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2
  
  # 滑动窗口数据集配置
  dataset_type: sliding_window          # heatmap_adapter | sliding_window
  sliding_window:
    min_history: 5                      # 最小历史帧数
    num_history_sample: 8               # 从历史中采样的帧数
    load_depth: true                    # 是否加载深度用于遮挡检测
    cache_poses: true                   # 是否缓存位姿

# ============================================
# 模型配置
# ============================================
model:
  type: spatial_mllm_pipeline
  use_multi_gpu: false
  vggt_gpu: cuda
  dinov3_gpu: cuda
  llm_gpu: cuda

  # LLM 配置
  llm:
    model_path: /root/VLN/Project/models/qwen_2.5_vl
    use_real_llm: true

  # 热力图头配置 (Diffusion-based dual heads)
  heatmap_head:
    enable_history: true                # 启用历史热力图头
    enable_future: true                 # 启用未来热力图头
    cond_dim: 512                       # 条件维度
    num_inference_steps: 10             # 推理时扩散步数

  # 动作头配置
  action_head:
    enable: true
    cond_dim: 2048                      # LLM 输出维度
    action_dim: 2                       # 2D 动作 (dx, dy)
    pred_horizon: 1                     # 预测步数
    num_diffusion_iters: 10             # 扩散步数
    encoding_size: 768                  # 条件投影维度

# ============================================
# 训练策略（Warmup → Full 三阶段）
# ============================================
training:
  stages:
    # ============ Stage 1: Warmup (64x64) ============
    # 预热阶段：小分辨率，只训练 heads
    - name: warmup_64
      epochs: 5
      hm_size: [64, 64]
      train_history: true
      train_future: false
      train_action: true
      trainable_modules:
        - history_heatmap_head
        - action_head
      frozen_modules:
        - vggt
        - dinov3_compat
        - future_heatmap_head
        - feature_fusion
        - llm_projector
      
    # ============ Stage 2: Mid (128x128) ============
    # 中间阶段：提升分辨率，解冻更多模块
    - name: mid_128
      epochs: 10
      hm_size: [128, 128]
      train_history: true
      train_future: true
      train_action: true
      trainable_modules:
        - history_heatmap_head
        - future_heatmap_head
        - action_head
        - feature_fusion
      frozen_modules:
        - vggt
        - dinov3_compat
        - llm_projector
      
    # ============ Stage 3: Full (224x224) ============
    # 完整训练：大分辨率，解冻所有可训练模块
    - name: full_224
      epochs: 20
      hm_size: [224, 224]
      train_history: true
      train_future: true
      train_action: true
      trainable_modules:
        - history_heatmap_head
        - future_heatmap_head
        - action_head
        - feature_fusion
        - llm_projector
      frozen_modules:
        - vggt
        - dinov3_compat

# ============================================
# 优化器配置
# ============================================
optim:
  optimizer: adamw
  # 分组学习率
  heatmap_lr: 1.0e-3                    # 热力图头默认学习率
  history_heatmap_lr: 1.0e-3            # 历史头
  future_heatmap_lr: 1.0e-3             # 未来头
  action_lr: 1.0e-3                     # 动作头学习率
  fusion_lr: 5.0e-4                     # feature_fusion + llm_projector
  encoder_lr: 1.0e-5                    # vggt + dinov3_compat

  weight_decay: 1.0e-2
  grad_clip: 1.0
  amp: bf16
  scheduler: cosine
  warmup_ratio: 0.05
  batch_size: 2                         # 滑动窗口数据集可以用更大 batch
  grad_accum_steps: 4                   # 有效 batch = 2 × 4 = 8
  use_ddp: false

# ============================================
# 损失函数
# ============================================
loss:
  type: navigation_heatmap
  alpha: 20.0
  lambda_mse: 1.0
  lambda_kl: 0.2
  lambda_valid: 0.1
  
  # 各头损失权重
  history_weight: 1.0                   # History 热力图损失权重
  future_weight: 1.0                    # Future 热力图损失权重
  action_weight: 0.5                    # 动作损失权重

# ============================================
# GPU配置
# ============================================
gpu:
  devices: [0]
  backend: nccl

# ============================================
# 日志与保存
# ============================================
log:
  out_dir: /root/autodl-tmp/vln_history_action_outputs
  save_every_epochs: 1
  vis_every_steps: 100
  max_ckpts: 3
  use_tensorboard: true
  tensorboard_dir: /root/tf-logs
  log_interval: 10
  show_gpu_memory: true
  tqdm_ncols: 120
  log_level: INFO

# ============================================
# 验证配置
# ============================================
validation:
  eval_every_epochs: 1
  save_best_metric: val_total_loss
  patience: 5
