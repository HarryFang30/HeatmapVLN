seed: 42

# ============================================
# 数据配置
# ============================================
data:
  root: /root/autodl-tmp/dataset_with_actions
  image_size: [224, 224]
  init_hm_size: [64, 64]                # 起始分辨率
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2
  
  # 滑动窗口数据集配置
  dataset_type: sliding_window          # heatmap_adapter | sliding_window
  sliding_window:
    min_history: 5                      # 最小历史帧数
    num_history_sample: 8               # 从历史中采样的帧数
    load_depth: true                    # 是否加载深度用于遮挡检测
    cache_poses: true                   # 是否缓存位姿

# ============================================
# 模型配置
# ============================================
model:
  type: spatial_mllm_pipeline
  use_multi_gpu: false
  vggt_gpu: cuda
  dinov3_gpu: cuda
  llm_gpu: cuda

  # LLM 配置
  llm:
    model_path: /root/VLN/Project/models/qwen_2.5_vl
    use_real_llm: true

  # 动作头配置
  action_head:
    enable: true
    cond_dim: 2048                      # LLM 输出维度
    action_dim: 2                       # 2D 动作 (dx, dy)
    pred_horizon: 1                     # 预测步数
    num_diffusion_iters: 10             # 扩散步数
    encoding_size: 768                  # 条件投影维度

# ============================================
# 训练策略（两阶段：History+Action → Future+Action）
# ============================================
training:
  stages:
    # ============ 阶段 A: History + Action ============
    
    # A1: History + Action 头预热 (64x64)
    - name: stage_a1_history_action_warmup
      epochs: 5
      hm_size: [64, 64]
      train_history: true
      train_future: false
      train_action: true
      trainable_modules:
        - history_heatmap_converter
        - action_head
        - feature_fusion
        - llm_projector
      frozen_modules:
        - vggt
        - dinov3_compat
        - future_heatmap_converter

    # A2: History + Action 提升分辨率 (64→128)
    - name: stage_a2_history_action_128
      epochs: 8
      hm_size: [128, 128]
      train_history: true
      train_future: false
      train_action: true
      trainable_modules:
        - history_heatmap_converter
        - action_head
        - feature_fusion
        - llm_projector
      frozen_modules:
        - vggt
        - dinov3_compat
        - future_heatmap_converter

    # A3: History + Action 全模块微调 (128)
    - name: stage_a3_history_action_full
      epochs: 10
      hm_size: [128, 128]
      train_history: true
      train_future: false
      train_action: true
      trainable_modules:
        - history_heatmap_converter
        - action_head
        - feature_fusion
        - llm_projector
        - vggt
        - dinov3_compat
      frozen_modules:
        - future_heatmap_converter

    # ============ 阶段 B: Future + Action ============
    
    # B1: Future + Action 头预热 (128)
    - name: stage_b1_future_action_warmup
      epochs: 5
      hm_size: [128, 128]
      train_history: false
      train_future: true
      train_action: true
      trainable_modules:
        - future_heatmap_converter
        - action_head
        - feature_fusion
        - llm_projector
      frozen_modules:
        - vggt
        - dinov3_compat
        - history_heatmap_converter

    # B2: Future + Action 提升分辨率 (128→224)
    - name: stage_b2_future_action_224
      epochs: 10
      hm_size: [224, 224]
      train_history: false
      train_future: true
      train_action: true
      trainable_modules:
        - future_heatmap_converter
        - action_head
        - feature_fusion
        - llm_projector
        - vggt
        - dinov3_compat
      frozen_modules:
        - history_heatmap_converter

# ============================================
# 优化器配置
# ============================================
optim:
  optimizer: adamw
  # 分组学习率
  heatmap_lr: 1.0e-3               # 热力图 converter 学习率
  history_heatmap_lr: 1.0e-3       # 历史头
  future_heatmap_lr: 1.0e-3        # 未来头
  action_lr: 1.0e-3                # 动作头学习率
  fusion_lr: 5.0e-4                # feature_fusion + llm_projector
  encoder_lr: 1.0e-5               # vggt + dinov3_compat

  weight_decay: 1.0e-2
  grad_clip: 1.0
  amp: bf16
  scheduler: cosine
  warmup_ratio: 0.05
  batch_size: 2                     # 滑动窗口数据集可以用更大 batch
  grad_accum_steps: 4               # 有效 batch = 2 × 4 = 8
  use_ddp: false

# ============================================
# 损失函数
# ============================================
loss:
  type: navigation_heatmap
  alpha: 20.0
  lambda_mse: 1.0
  lambda_kl: 0.2
  lambda_valid: 0.1
  
  # 各头损失权重
  history_weight: 1.0               # History 热力图损失权重
  future_weight: 1.0                # Future 热力图损失权重
  action_weight: 0.5                # 动作损失权重

# ============================================
# GPU配置
# ============================================
gpu:
  devices: [0]
  backend: nccl

# ============================================
# 日志与保存
# ============================================
log:
  out_dir: /root/autodl-tmp/vln_history_action_outputs
  save_every_epochs: 1
  vis_every_steps: 100
  max_ckpts: 3
  use_tensorboard: true
  tensorboard_dir: /root/tf-logs
  log_interval: 10
  show_gpu_memory: true
  tqdm_ncols: 120
  log_level: INFO

# ============================================
# 验证配置
# ============================================
validation:
  eval_every_epochs: 1
  save_best_metric: val_total_loss
  patience: 5
