seed: 42

# ============================================
# 数据配置
# ============================================
data:
  root: /root/autodl-tmp/dataset_with_actions
  train_split: train                    # 训练集目录名
  val_split: val_unseen                 # 验证集目录名 (VLN-CE 使用 val_unseen)
  image_size: [224, 224]
  init_hm_size: [64, 64]                # 起始分辨率
  num_workers: 4                        # 减少 workers 避免 CPU 竞争
  pin_memory: true
  prefetch_factor: 2
  
  # 滑动窗口数据集配置
  dataset_type: sliding_window          # heatmap_adapter | sliding_window
  sliding_window:
    min_history: 5                      # 最小历史帧数
    num_history_sample: 8               # 从历史中采样的帧数
    load_depth: true                    # 是否加载深度用于遮挡检测
    cache_poses: true                   # 是否缓存位姿

# ============================================
# 模型配置
# ============================================
model:
  type: spatial_mllm_pipeline
  use_multi_gpu: false
  vggt_gpu: cuda
  dinov3_gpu: cuda
  llm_gpu: cuda

  # LLM 配置
  llm:
    model_path: /root/VLN/Project/models/qwen_2.5_vl
    use_real_llm: true

  # 热力图头配置 (Diffusion-based dual heads)
  heatmap_head:
    enable_history: true                # 启用历史热力图头
    enable_future: true                 # 启用未来热力图头
    cond_dim: 512                       # 条件维度
    num_inference_steps: 10             # 推理时扩散步数

  # 动作头配置
  action_head:
    enable: true
    cond_dim: 2048                      # LLM 输出维度
    action_dim: 2                       # 2D 动作 (dx, dy)
    pred_horizon: 1                     # 预测步数
    num_diffusion_iters: 10             # 扩散步数
    encoding_size: 768                  # 条件投影维度

# ============================================
# 训练策略（4 阶段渐进式训练）
# ============================================
training:
  stages:
    # ============ Stage 1: History 预热 (64x64) ============
    # 预热 History head + Action head + Fusion
    - name: warmup_history_64
      epochs: 3
      hm_size: [64, 64]
      heatmap_loss_type: simplified     # Warmup 使用简化 Loss
      train_history: true
      train_future: false
      train_action: true
      trainable_modules:
        - history_heatmap_head
        - action_head
        - feature_fusion                # 解冻 fusion，让 heads 有合适的输入
      frozen_modules:
        - vggt
        - dinov3_compat
        - future_heatmap_head
        - llm_projector
      
    # ============ Stage 2: Future 预热 (64x64) ============
    # 预热 Future head，冻结 History 让 Future 赶上
    - name: warmup_future_64
      epochs: 3
      hm_size: [64, 64]
      heatmap_loss_type: simplified     # 继续使用简化 Loss
      train_history: false              # 冻结 History，让 Future 赶上
      train_future: true
      train_action: true
      trainable_modules:
        - future_heatmap_head
        - action_head
        - feature_fusion
      frozen_modules:
        - vggt
        - dinov3_compat
        - history_heatmap_head          # 暂时冻结 History
        - llm_projector
      
    # ============ Stage 3: 联合训练 (128x128) ============
    # 中间阶段：提升分辨率，双 head 联合训练，使用完整 Loss
    - name: joint_128
      epochs: 10
      hm_size: [128, 128]
      heatmap_loss_type: nerf_ripple    # 切换到 NeRF 波纹 Loss
      train_history: true
      train_future: true
      train_action: true
      trainable_modules:
        - history_heatmap_head
        - future_heatmap_head
        - action_head
        - feature_fusion
      frozen_modules:
        - vggt
        - dinov3_compat
        - llm_projector
      
    # ============ Stage 4: 精细训练 (224x224) ============
    # 完整训练：大分辨率，解冻 LLM Projector
    - name: full_224
      epochs: 20
      hm_size: [224, 224]
      heatmap_loss_type: nerf_ripple    # 继续使用 NeRF 波纹 Loss
      train_history: true
      train_future: true
      train_action: true
      trainable_modules:
        - history_heatmap_head
        - future_heatmap_head
        - action_head
        - feature_fusion
        - llm_projector
      frozen_modules:
        - vggt
        - dinov3_compat

# ============================================
# 优化器配置
# ============================================
optim:
  optimizer: adamw
  
  # 分组学习率（针对 Diffusion 模型调优）
  # Diffusion 模型推荐 LR: 1e-4 ~ 3e-4
  heatmap_lr: 3.0e-4                    # 热力图头默认学习率
  history_heatmap_lr: 3.0e-4            # 历史头（Diffusion）
  future_heatmap_lr: 3.0e-4             # 未来头（Diffusion）
  action_lr: 3.0e-4                     # 动作头（Diffusion）
  fusion_lr: 1.0e-4                     # feature_fusion + llm_projector
  encoder_lr: 1.0e-5                    # vggt + dinov3_compat（冻结或微调）

  weight_decay: 1.0e-4                   # 降低 weight decay，对 Diffusion 更友好
  grad_clip: 1.0
  amp: bf16
  scheduler: cosine
  warmup_ratio: 0.1                     # Warmup 比例 10%
  batch_size: 2                         # 滑动窗口数据集
  grad_accum_steps: 4                   # 有效 batch = 2 × 4 = 8
  use_ddp: false

# ============================================
# 损失函数
# ============================================
loss:
  # 热力图损失类型选择：
  # - simplified: SimplifiedHeatmapLoss (warmup 推荐)
  # - nerf_ripple: NeRFRippleHeatmapLoss (完整训练推荐)
  # - navigation: NavigationHeatmapLoss (原版，会平滑 GT)
  heatmap_loss_type: simplified         # 默认使用简化版
  
  # SimplifiedHeatmapLoss 参数
  simplified:
    lambda_mse: 1.0
    lambda_grad: 0.3
    peak_weight: 5.0
  
  # NeRFRippleHeatmapLoss 参数
  nerf_ripple:
    lambda_mse: 1.0
    lambda_fft: 0.3                     # 频域损失（保持波纹结构）
    lambda_radial: 0.2                  # 径向梯度损失（同心圆）
    lambda_peak: 1.0                    # 峰值定位损失
    fft_weight_decay: 0.5               # 高频权重衰减
  
  # NavigationHeatmapLoss 参数（原版，不推荐）
  navigation:
    alpha: 20.0
    lambda_mse: 1.0
    lambda_kl: 0.2
    lambda_valid: 0.1
    smooth_gt: false                    # 设为 false 保留波纹
  
  # 各头损失权重
  history_weight: 1.0                   # History 热力图损失权重
  future_weight: 1.0                    # Future 热力图损失权重
  action_weight: 0.5                    # 动作损失权重

# ============================================
# GPU配置
# ============================================
gpu:
  devices: [0]
  backend: nccl

# ============================================
# 日志与保存
# ============================================
log:
  out_dir: /root/autodl-tmp/vln_history_action_outputs
  save_every_epochs: 1
  vis_every_steps: 100
  max_ckpts: 3
  use_tensorboard: true
  tensorboard_dir: /root/tf-logs
  log_interval: 10
  show_gpu_memory: true
  tqdm_ncols: 120
  log_level: INFO
  
  # 飞书通知配置
  notify:
    enabled: true                              # 是否启用通知
    platform: feishu                           # 通知平台: feishu
    webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/60a6d820-9069-4963-8116-46bd68e668aa"

# ============================================
# 验证配置
# ============================================
validation:
  eval_every_epochs: 1
  save_best_metric: val_total_loss
  patience: 5
