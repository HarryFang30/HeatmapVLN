seed: 42

# ============================================
# 数据配置 - 使用 patrol_data 数据集
# ============================================
data:
  root: /root/autodl-tmp/heatmap_train_data
  train_split: train
  val_split: val
  image_size: [224, 224]
  init_hm_size: [64, 64]
  num_workers: 8          # persistent_workers=False 保护下可安全使用 8 workers
  pin_memory: true
  prefetch_factor: 4      # 多预取掩盖 IO 延迟，配合 persistent=False 不会碎片化泄漏
  
  # 使用 sliding_window 数据集（patrol_data 没有 trajectory 数据）
  dataset_type: sliding_window
  
  sliding_window:
    min_history: 5
    num_history_sample: 32       # 历史帧采样数量
    load_depth: true             # 加载深度图用于遮挡检测
    cache_poses: true
    sample_stride: 2             # 采样步长
    
    # GPU 热力图计算 — 全景模式下必须关闭（GPU 版只支持单视角，4 视角热力图由 CPU 在 DataLoader 中生成）
    defer_heatmap_to_gpu: false
    
    # Clip-level 采样策略
    clip_level_sampling: true
    samples_per_clip: 45         # 每 clip 采样 45 个样本 (9:1 比例)
    val_samples_per_clip: 5      # 验证集采样数
  
  # 轨迹数据集配置（未使用，保留以兼容代码）
  trajectory:
    min_history: 5
    num_history_sample: 32
    load_depth: true
    cache_poses: true
    sample_stride: 2
    clip_level_sampling: true
    samples_per_clip: 30
    val_samples_per_clip: 10
    random_subsequence: false
    min_subsequence_length: 30
    subsequence_samples_per_clip: 5
    predict_horizon: 24
    action_scale: 4.0
    enable_trajectory_augmentation: false
    use_subinstruction: false
    fgr2r_subinstr_path: null

# ============================================
# 模型配置
# ============================================
model:
  type: vln_pipeline
  device: cuda

  # Qwen3-VL 配置
  llm:
    model_path: ./models/qwen_3_vl
    hidden_dim: 4096
    token_dim: 1024
    torch_dtype: bfloat16
    attn_implementation: flash_attention_2
    max_video_frames: -1       # -1 表示不限制帧数
    
    # Sequence Packing 配置
    enable_packing: true
    max_seq_length: 8192
    spatial_merge_size: 2
    
    # 多层特征提取 — DPT 需要 4 层均匀分布的中间层特征
    # Layer 4  = 浅层（空间信息最丰富，~11% depth）
    # Layer 12 = 中浅层（空间-低级语义，~33% depth）
    # Layer 20 = 中深层（语义信息增强，~56% depth）
    # Layer 28 = 深层（高级语义，~78% depth）
    multi_layer_features: true
    feature_layer_indices: [4, 12, 20, 28]
    feature_fusion_method: weighted_sum   # DPT 模式下不使用此项，但保留兼容性
    
    # LoRA 配置 — 开启以让 LLM 产生更适合空间推理的特征
    # 扩展覆盖范围：空间理解在 VLM 中间层(12-24层)形成，仅最后4层不够
    use_lora: true
    lora_rank: 32              # 16 → 32，增强表达能力
    lora_alpha: 64             # 保持 alpha/rank = 2 的比例
    lora_num_layers: 8         # 4 → 8，覆盖更多空间理解层
    lora_dropout: 0.05
    lora_target_modules:       # 增加 k_proj，完整覆盖注意力矩阵
      - q_proj
      - k_proj
      - v_proj

  # 热力图头配置 (只训练 history head)
  heatmap_head:
    enable_history: true
    enable_future: false

    # Head 类型: "dpt" (DPT 直接预测), "diffusion", "direct"
    head_type: dpt

    # Spatial-Semantic Fusion Head 配置 (head_type == "dpt")
    # ViT pre-merge 特征提供 16x16 空间精度, LLM token 提供语义引导
    dpt:
      proj_dim: 256               # 投影 / cross-attention 维度
      features: 256               # 同 proj_dim (兼容旧键名)
      vit_dim: 1152               # ViT hidden size (Qwen3-VL)
      vit_hook_layers: [6, 13, 20, 26]  # 要 hook 的 ViT block 索引
      spatial_merge_size: 2       # Qwen3-VL spatial merge factor
      n_cross_attn_heads: 4       # cross-attention heads
      lambda_spatial: 0.5         # soft-argmax peak 位移损失权重

    # 以下配置仅在 diffusion/direct 模式下生效，DPT 模式不使用
    cond_dim: 1024
    block_out_channels: [128, 256, 512, 512]
    layers_per_block: 2
    attention_levels: [1, 2, 3]
    cross_attention_levels: [0, 1, 2, 3]
    num_inference_steps: 50
    num_train_timesteps: 200
    cfg_drop_prob: 0.15
    cfg_scale: 2.0
    dropout: 0.1
    use_circular_padding: false
    use_image_encoder: true
    image_encoder_use_pretrained: true
    use_spatial_injection: true
    pool_method: attention
    pool_num_heads: 8
    use_sequence_conditioning: true
    seq_cross_attn_heads: 8
    seq_cross_attn_head_dim: 64
    sharpen_temperature: 0.1
    negative_sample_weight: 1.0
    positive_sample_boost: 3.0
    peak_spatial_weight: 10.0

    direct:
      hidden_dim: 256
      num_decoder_blocks: 3
      decoder_num_heads: 8
      decoder_head_dim: 64
      lambda_dice: 0.5
      lambda_peak: 1.0
      focal_gamma: 2.0
      init_bias: -5.0

  # 动作头配置 - 禁用（不训练动作）
  action_head:
    enable: false              # 完全禁用动作头
    type: transformer
    
    legacy:
      cond_dim: 1024
      action_dim: 2
      pred_horizon: 1
      num_diffusion_iters: 10
      encoding_size: 256
      down_dims: [128, 256]
      action_stats_min: [-0.1646, -0.0281]
      action_stats_max: [0.1850, 0.3087]
    
    transformer:
      vlm_token_dim: 1024
      n_emb: 384
      predict_size: 24
      n_layer: 16
      n_head: 6               # 对齐 InternNav: n_emb // head_dim = 384 // 64 = 6
      n_cond_layers: 4
      action_dim: 3
      num_train_timesteps: 20
      p_drop_emb: 0.2
      p_drop_attn: 0.2
      causal_attn: true

  # Progress 预测头 - 禁用
  progress_head:
    enable: false              # 禁用进度预测
    hidden_dim: 512
    dropout: 0.3
    concat_state_txt: true

  # Stop 预测头 - 禁用
  stop_head:
    enable: false
    hidden_dim: 512
    focal_gamma: 3.0
    focal_alpha: 0.9

# ============================================
# 训练策略 - 只训练热力图头
# ============================================
training:
  stages:
    - name: heatmap_only_64
      epochs: 15               # 15 epoch 正式训练
      hm_size: [64, 64]
      heatmap_loss_type: simplified
      train_history: true
      train_future: false
      train_action: false      # 不训练动作
      trainable_modules:
        - history_heatmap_head    # 训练 DPT 热力图头
        - llm_projector           # 训练投影层（非 DPT 头仍需要）
        - multi_layer_fusion      # 训练多层融合权重（非 DPT 头仍需要）
        - lora                    # 训练 LoRA 层（微调 LLM）
      frozen_modules:
        - qwen3_vl             # 冻结 VLM（LoRA 层除外）
        - future_heatmap_head
        - transformer_action_head
        - action_head
        - progress_head
        - stop_head

# ============================================
# 优化器配置
# ============================================
optim:
  optimizer: adamw

  # 分组学习率
  heatmap_lr: 5.0e-5
  history_heatmap_lr: 5.0e-5
  future_heatmap_lr: 5.0e-5
  action_lr: 1.0e-4
  transformer_action_lr: 1.0e-4
  progress_lr: 1.0e-4
  llm_projector_lr: 3.0e-5         # 5e-5 → 3e-5，更稳定
  multi_layer_fusion_lr: 1.0e-4    # 融合模块只有少量参数，可以用较高 LR
  lora_lr: 1.0e-5                  # LoRA 使用极低 LR

  # 正则化（增强）
  weight_decay: 1.0e-1             # 5e-2 → 1e-1
  projector_weight_decay: 1.0e-2   # 5e-3 → 1e-2
  
  # EMA (Exponential Moving Average)
  ema_decay: 0.999                   # 滑动平均衰减率，验证和保存使用 EMA 参数
  
  grad_clip: 1.0
  amp: bf16
  scheduler: cosine
  warmup_ratio: 0.1
  min_lr: 1.0e-6
  
  # 批量配置 — 全景 4 视角模式下 heatmap head 有效 batch = 4*4 = 16
  batch_size: 4               # 4 视角展开后 heatmap head 实际处理 B*4=16
  grad_accum_steps: 4         # 有效 batch = 4*4 = 16

# ============================================
# 损失函数
# ============================================
loss:
  heatmap_loss_type: simplified
  
  simplified:
    lambda_mse: 1.0
    lambda_grad: 0.3
    peak_weight: 5.0
  
  nerf_ripple:
    lambda_mse: 1.0
    lambda_fft: 0.3
    lambda_radial: 0.2
    lambda_peak: 1.0
    fft_weight_decay: 0.5
  
  # 只有热力图损失有效
  history_weight: 1.0
  future_weight: 0.0
  action_weight: 0.0
  trajectory_weight: 0.0
  progress_weight: 0.0
  stop_weight: 0.0

# ============================================
# GPU配置
# ============================================
gpu:
  devices: [0]
  backend: nccl

# ============================================
# 日志与保存
# ============================================
log:
  out_dir: /root/autodl-tmp/heatmap_training_outputs
  save_every_epochs: 1
  vis_every_steps: 100
  val_vis_batches: 2
  max_ckpts: 5
  use_tensorboard: true
  tensorboard_dir: /root/tf-logs/heatmap_only
  log_interval: 10
  show_gpu_memory: true
  tqdm_ncols: 120
  log_level: INFO
  diag_interval: 100
  
  # 飞书通知配置
  notify:
    enabled: true
    platform: feishu
    webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/60a6d820-9069-4963-8116-46bd68e668aa"

# ============================================
# 验证配置
# ============================================
validation:
  eval_every_epochs: 1
  save_best_metric: val_total_loss
  patience: 5               # 只训练一个头，可以更耐心
  val_inference_batches: 10  # 完整扩散推理的 batch 数（计算真实 heatmap MSE）
                             # 其余 batch 用噪声预测 loss（快 ~40x）
