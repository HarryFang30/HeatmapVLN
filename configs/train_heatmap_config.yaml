seed: 42

# ============================================
# 数据配置 - 热力图专用训练（单卡）
# ============================================
data:
  root: /workspace/heatmap_train_data
  train_split: train
  val_root: /workspace/val_unseen
  val_split: all
  image_size: [256, 256]
  init_hm_size: [64, 64]
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  
  dataset_type: sliding_window
  
  sliding_window:
    min_history: 5
    num_history_sample: 8
    load_depth: true
    load_history_frames: false
    cache_poses: true
    sample_stride: 2
    defer_heatmap_to_gpu: false
    clip_level_sampling: true
    samples_per_clip: 15
    val_samples_per_clip: 5
  
  trajectory:
    min_history: 5
    num_history_sample: 8
    load_depth: true
    cache_poses: true
    sample_stride: 2
    clip_level_sampling: true
    samples_per_clip: 30
    val_samples_per_clip: 10
    random_subsequence: false
    min_subsequence_length: 30
    subsequence_samples_per_clip: 5
    predict_horizon: 24
    action_scale: 4.0
    enable_trajectory_augmentation: false
    use_subinstruction: false
    fgr2r_subinstr_path: null

# ============================================
# 模型配置 — InternNav backbone (Qwen2.5-VL)
# ============================================
model:
  type: vln_pipeline
  device: cuda

  llm:
    model_path: ./models/internnav_backbone
    backbone_type: qwen2_5_vl
    hidden_dim: 3584
    token_dim: 896
    torch_dtype: bfloat16
    attn_implementation: sdpa
    max_video_frames: -1
    enable_packing: false
    max_seq_length: 8192
    spatial_merge_size: 2
    use_lora: true
    lora_rank: 16
    lora_alpha: 32
    lora_layer_indices: [5, 6, 12, 13, 19, 20]
    lora_dropout: 0.05

  # HeatmapVLN v2 Coarse-to-Fine
  heatmap:
    enable: true
    c_vit: 1280               # Qwen2.5-VL ViT hidden_size
    c_llm: 3584               # Qwen2.5-VL LLM hidden_size
    c_fused: 256
    vit_layer_indices: [7, 15, 23, 31]
    llm_layer_indices: [6, 13, 20]
    heatmap_size: [64, 64]
    image_size: 256

    lambda_vis: 1.0
    lambda_coord: 0.2
    lambda_kl: 0.0
    lambda_peak: 1.0

    trajectory:
      enable: true
      num_freqs: 16
      d_attn: 256
      num_heads: 4
      num_layers: 2
      max_spatial_range: 10.0

  action_head:
    enable: false

# ============================================
# 训练策略 - 只训练热力图
# ============================================
training:
  stages:
    - name: heatmap_only_64
      epochs: 8
      hm_size: [64, 64]
      heatmap_loss_type: heatmap_vln
      train_heatmap: true
      train_action: false
      trainable_modules:
        - heatmap_vln
        - lora
      frozen_modules:
        - vlm_backbone

# ============================================
# 优化器配置
# ============================================
optim:
  optimizer: adamw
  learning_rate: 1.0e-4
  heatmap_lr: 1.0e-4
  vis_head_lr: 1.0e-3
  lora_lr: 5.0e-6
  weight_decay: 1.0e-2
  grad_clip: 1.0
  amp: bf16
  scheduler: cosine
  warmup_ratio: 0.05
  min_lr: 1.0e-6
  batch_size: 4
  grad_accum_steps: 2

# ============================================
# 损失函数
# ============================================
loss:
  heatmap_loss_type: heatmap_vln
  
  heatmap_vln:
    lambda_vis: 1.0
    lambda_coord: 0.2
    lambda_kl: 0.0
    lambda_peak: 1.0
    lambda_neg: 1.0
    temperature: 1.0
    vis_pos_weight: 7.0
    temperature_schedule:
      enabled: false
      mode: cosine
      start: 1.0
      end: 1.0
  
  heatmap_weight: 1.0
  trajectory_weight: 0.0

# ============================================
# GPU配置
# ============================================
gpu:
  devices: [0]
  backend: nccl
  multi_gpu:
    enabled: false
    find_unused_parameters: false

# ============================================
# 日志与保存
# ============================================
log:
  out_dir: /workspace/heatmap_training_outputs
  save_every_epochs: 1
  vis_every_steps: 100
  val_vis_batches: 2
  max_ckpts: 5
  use_tensorboard: true
  tensorboard_dir: /workspace/tf-logs
  enable_timing: false
  epoch_boundary_cooldown_s: 8
  log_interval: 10
  show_gpu_memory: false
  tqdm_ncols: 120
  log_level: INFO
  diag_interval: 100
  mid_epoch_save_every: 500
  
  notify:
    enabled: true
    platform: feishu
    webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/60a6d820-9069-4963-8116-46bd68e668aa"

# ============================================
# 验证配置
# ============================================
validation:
  eval_every_epochs: 1
  save_best_metric: val_total_loss
  patience: 30
  val_inference_batches: 6
