seed: 42

# ============================================
# 数据配置 - 使用 patrol_data 数据集
# ============================================
data:
  root: /root/autodl-tmp/heatmap_train_data
  train_split: train
  val_split: val
  image_size: [224, 224]
  init_hm_size: [64, 64]
  num_workers: 8          # persistent_workers=False 保护下可安全使用 8 workers
  pin_memory: true
  prefetch_factor: 4      # 多预取掩盖 IO 延迟，配合 persistent=False 不会碎片化泄漏
  
  # 使用 sliding_window 数据集（patrol_data 没有 trajectory 数据）
  dataset_type: sliding_window
  
  sliding_window:
    min_history: 5
    num_history_sample: 32       # 历史帧采样数量
    load_depth: true             # 加载深度图用于遮挡检测
    cache_poses: true
    sample_stride: 2             # 采样步长
    
    # GPU 热力图计算 — 全景模式下关闭（4 视角热力图在 CPU 生成更简单）
    defer_heatmap_to_gpu: false
    
    # Clip-level 采样策略
    clip_level_sampling: true
    samples_per_clip: 45         # 每 clip 采样 45 个样本 (9:1 比例)
    val_samples_per_clip: 5      # 验证集采样数
  
  # 轨迹数据集配置（未使用，保留以兼容代码）
  trajectory:
    min_history: 5
    num_history_sample: 32
    load_depth: true
    cache_poses: true
    sample_stride: 2
    clip_level_sampling: true
    samples_per_clip: 30
    val_samples_per_clip: 10
    random_subsequence: false
    min_subsequence_length: 30
    subsequence_samples_per_clip: 5
    predict_horizon: 24
    action_scale: 4.0
    enable_trajectory_augmentation: false
    use_subinstruction: false
    fgr2r_subinstr_path: null

# ============================================
# 模型配置
# ============================================
model:
  type: vln_pipeline
  device: cuda

  # Qwen3-VL 配置
  llm:
    model_path: ./models/qwen_3_vl
    hidden_dim: 4096
    token_dim: 1024
    torch_dtype: bfloat16
    attn_implementation: flash_attention_2
    max_video_frames: -1       # -1 表示不限制帧数
    
    # Sequence Packing 配置
    enable_packing: true
    max_seq_length: 8192
    spatial_merge_size: 2
    
    # 多层特征提取 (CVPR 2025 best practice)
    # 从 LLM 的不同深度提取特征并融合，同时保留空间和语义信息
    # Layer 4  = DeepStack 注入后的早期特征（空间信息最丰富）
    # Layer 18 = 中间层（空间-语义平衡，~50% depth）
    # Layer 32 = 深层（语义信息丰富，用于高层理解）
    multi_layer_features: true
    feature_layer_indices: [4, 18, 32]
    feature_fusion_method: weighted_sum   # "weighted_sum" 或 "concat_project"
    
    # LoRA 配置 — 开启以让 LLM 产生更适合空间推理的特征
    # 扩展覆盖范围：空间理解在 VLM 中间层(12-24层)形成，仅最后4层不够
    use_lora: true
    lora_rank: 32              # 16 → 32，增强表达能力
    lora_alpha: 64             # 保持 alpha/rank = 2 的比例
    lora_num_layers: 8         # 4 → 8，覆盖更多空间理解层
    lora_dropout: 0.05
    lora_target_modules:       # 增加 k_proj，完整覆盖注意力矩阵
      - q_proj
      - k_proj
      - v_proj

  # 热力图头配置 (只训练 history head)
  heatmap_head:
    enable_history: true
    enable_future: false       # 禁用 future head
    
    # 条件编码维度
    cond_dim: 1024
    
    # UNet 架构配置
    block_out_channels: [128, 256, 512, 512]
    layers_per_block: 2
    attention_levels: [1, 2, 3]    # [2,3] → [1,2,3]，在 32x32 层增加注意力改善锐度
    
    # Diffusion 配置
    num_inference_steps: 50        # 20 → 50，更精细的去噪恢复锐利峰值
    num_train_timesteps: 200       # 200 训练步，50 推理步 = 4:1 比例
    
    # Classifier-Free Guidance
    cfg_drop_prob: 0.15         # 提高 drop 比例，让模型更好地学习无条件生成
    cfg_scale: 2.0              # 1.5 → 2.0，增强条件引导使峰值更锐利（配合 visibility head 控制假阳性）
    
    # 正则化
    dropout: 0.15               # 增加 dropout 抑制过拟合（0.1 → 0.15）
    
    # Pinhole 相机不需要循环填充（非 360° 全景）
    use_circular_padding: false
    
    # 启用 CNN encoder，提供当前图像的空间特征
    use_image_encoder: true
    # 使用 ImageNet 预训练 ResNet-18 替代自建浅层 CNN
    # 通道数 [64, 128, 256, 512]（自动覆盖 image_encoder_channels）
    # 提供更丰富的多尺度语义特征（纹理→物体部件→物体→场景）
    image_encoder_use_pretrained: true
    # CNN 多尺度空间特征注入 UNet skip connections
    # 解决全局池化导致的空间信息丢失，让 UNet 知道"目标在哪里"
    use_spatial_injection: true
    
    # LLM token pooling（全局路径）
    pool_method: attention
    pool_num_heads: 8
    
    # 序列级 Cross-Attention 条件注入（解决单向量信息瓶颈）
    use_sequence_conditioning: true
    seq_cross_attn_heads: 8
    seq_cross_attn_head_dim: 64
    
    # 可见性预测头（消除假阳性）- 增强版 3 层 MLP
    # 当预测为不可见时跳过扩散推理，直接输出全零热力图
    use_visibility_head: true
    visibility_loss_weight: 1.0       # BCE loss 权重（0.1→1.0，增强 10 倍，让 visibility 训练更充分）
    visibility_threshold: 0.7         # 推理阈值（0.5→0.7，更保守地判定可见，减少假阳性）
    
    # 推理后处理：空间 Softmax 锐化
    # 集中能量到峰值区域，消除弥散问题
    sharpen_temperature: 0.1          # 温度越低越锐利（0 = 禁用）
    
    # x0 重构损失：直接监督输出质量
    # epsilon loss 只关心噪声预测，x0 loss 直接约束重构热力图像 GT
    x0_loss_weight: 1.0
    
    # L1 稀疏性正则化：鼓励大部分像素为 0
    sparsity_loss_weight: 0.5
    
    # 负样本（GT=全零）的扩散 loss 权重（0.1→0.3，让模型有效学习负样本）
    negative_sample_weight: 0.3
    
    # 可微分峰值距离损失：通过 Spatial Soft-Argmax 直接优化 peak_distance
    # 唯一直接优化峰值位置准确度的 loss（其他 loss 都是间接的）
    # 只对正样本计算，归一化到 [0,1] 范围
    peak_distance_loss_weight: 2.0    # 权重（0 = 禁用）
    peak_loss_temperature: 0.1        # soft-argmax 温度（越低越接近真实 argmax）

  # 动作头配置 - 禁用（不训练动作）
  action_head:
    enable: false              # 完全禁用动作头
    type: transformer
    
    legacy:
      cond_dim: 1024
      action_dim: 2
      pred_horizon: 1
      num_diffusion_iters: 10
      encoding_size: 256
      down_dims: [128, 256]
      action_stats_min: [-0.1646, -0.0281]
      action_stats_max: [0.1850, 0.3087]
    
    transformer:
      vlm_token_dim: 1024
      n_emb: 384
      predict_size: 24
      n_layer: 16
      n_head: 6               # 对齐 InternNav: n_emb // head_dim = 384 // 64 = 6
      n_cond_layers: 4
      action_dim: 3
      num_train_timesteps: 20
      p_drop_emb: 0.2
      p_drop_attn: 0.2
      causal_attn: true

  # Progress 预测头 - 禁用
  progress_head:
    enable: false              # 禁用进度预测
    hidden_dim: 512
    dropout: 0.3
    concat_state_txt: true

  # Stop 预测头 - 禁用
  stop_head:
    enable: false
    hidden_dim: 512
    focal_gamma: 3.0
    focal_alpha: 0.9

# ============================================
# 训练策略 - 只训练热力图头
# ============================================
training:
  stages:
    - name: heatmap_only_64
      epochs: 15               # 15 epoch（上轮 5 epoch 就到 best）
      hm_size: [64, 64]
      heatmap_loss_type: simplified
      train_history: true
      train_future: false
      train_action: false      # 不训练动作
      trainable_modules:
        - history_heatmap_head    # 训练热力图头
        - llm_projector           # 训练投影层
        - multi_layer_fusion      # 训练多层融合权重
        - lora                    # 训练 LoRA 层（微调 LLM 最后 8 层）
      frozen_modules:
        - qwen3_vl             # 冻结 VLM（LoRA 层除外）
        - future_heatmap_head
        - transformer_action_head
        - action_head
        - progress_head
        - stop_head

# ============================================
# 优化器配置
# ============================================
optim:
  optimizer: adamw

  # 分组学习率（降低以提升泛化）
  heatmap_lr: 5.0e-5               # 1e-4 → 5e-5，防止快速过拟合
  history_heatmap_lr: 5.0e-5
  resnet_backbone_lr: 1.0e-5       # ResNet-18 预训练 backbone 用更低 LR 防止破坏预训练特征
  future_heatmap_lr: 5.0e-5
  action_lr: 1.0e-4
  transformer_action_lr: 1.0e-4
  progress_lr: 1.0e-4
  llm_projector_lr: 3.0e-5         # 5e-5 → 3e-5，更稳定
  multi_layer_fusion_lr: 1.0e-4    # 融合模块只有少量参数，可以用较高 LR
  lora_lr: 1.0e-5                  # LoRA 使用极低 LR

  # 正则化（增强）
  weight_decay: 1.0e-1             # 5e-2 → 1e-1
  projector_weight_decay: 1.0e-2   # 5e-3 → 1e-2
  
  # EMA (Exponential Moving Average)
  ema_decay: 0.999                   # 滑动平均衰减率，验证和保存使用 EMA 参数
  
  grad_clip: 1.0
  amp: bf16
  scheduler: cosine
  warmup_ratio: 0.1
  min_lr: 1.0e-6
  
  # 批量配置 — 全景 4 视角模式下 heatmap head 有效 batch = 4*4 = 16
  batch_size: 4               # 4 视角展开后 heatmap head 实际处理 B*4=16
  grad_accum_steps: 4         # 有效 batch = 4*4 = 16

# ============================================
# 损失函数
# ============================================
loss:
  heatmap_loss_type: simplified
  
  simplified:
    lambda_mse: 1.0
    lambda_grad: 0.3
    peak_weight: 5.0
  
  nerf_ripple:
    lambda_mse: 1.0
    lambda_fft: 0.3
    lambda_radial: 0.2
    lambda_peak: 1.0
    fft_weight_decay: 0.5
  
  # 只有热力图损失有效
  history_weight: 1.0
  future_weight: 0.0
  action_weight: 0.0
  trajectory_weight: 0.0
  progress_weight: 0.0
  stop_weight: 0.0

# ============================================
# GPU配置
# ============================================
gpu:
  devices: [0]
  backend: nccl

# ============================================
# 日志与保存
# ============================================
log:
  out_dir: /root/autodl-tmp/heatmap_training_outputs
  save_every_epochs: 1
  vis_every_steps: 100
  val_vis_batches: 2
  max_ckpts: 5
  use_tensorboard: true
  tensorboard_dir: /root/tf-logs/heatmap_only
  log_interval: 10
  show_gpu_memory: true
  tqdm_ncols: 120
  log_level: INFO
  diag_interval: 100
  
  # 飞书通知配置
  notify:
    enabled: true
    platform: feishu
    webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/60a6d820-9069-4963-8116-46bd68e668aa"

# ============================================
# 验证配置
# ============================================
validation:
  eval_every_epochs: 1
  save_best_metric: val_total_loss
  patience: 5               # 只训练一个头，可以更耐心
  val_inference_batches: 10  # 完整扩散推理的 batch 数（计算真实 heatmap MSE）
                             # 其余 batch 用噪声预测 loss（快 ~40x）
