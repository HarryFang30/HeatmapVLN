# EXP-10 bridge-off arm: validate the same v2 checkpoint with an exact-zero
# bridge (delta_z == 0), so the Future head and the sampled rollouts see the
# native plan_z0.  Identical to configs/ablation/exp09r_* except for
# past_plan_action_reset_bridge.  Run scripts/train.py with --validate-only and
# --load-weights <same v2 checkpoint>; nothing is trained.
# Ledger: docs/experiments/README.md (EXP-10).
seed: 42

paths:
  # Direct scene root: <root>/<scene>/clip_*.  With no nested train/val
  # directories, VLNSlidingWindowDataset deterministically auto-splits scenes
  # by md5(scene) % 100 (<10 val, otherwise train).
  dataset_root: $PPA_DATA_ROOT
  val_root: $PPA_DATA_ROOT
  log_out_dir: $PPA_ACTION_REFINE_OUTPUT_ROOT
  internnav_model_path: $INTERNNAV_MODEL_PATH

data:
  train_split: train
  val_split: val
  image_size: [384, 384]
  init_hm_size: [64, 64]
  # Eight ranks x two workers keeps the same 16-worker AFS pressure as the
  # audited four-rank launcher (four workers per rank).
  num_workers: 2
  pin_memory: true
  prefetch_factor: 2
  shm_bypass: auto
  dataset_type: trajectory
  use_worker_tokenized_collator: true
  in_order: true
  trajectory:
    min_history: 5
    num_history_sample: 8
    # Used only to construct supervision; depth/GT poses never enter the model.
    load_depth: true
    cache_poses: true
    sample_stride: 1
    clip_level_sampling: false
    samples_per_clip: 1
    val_samples_per_clip: 1
    random_subsequence: false
    predict_horizon: 32
    action_scale: 4.0
    enable_augmentation: false
    enable_trajectory_augmentation: false
    load_traj_images: true
    load_single_view_history_frames: true
    single_view_rgb_input: true
    amb3r_pose_cache_root: $PPA_AMB3R_CACHE_ROOT
    require_amb3r_pose_cache: true
    amb3r_pose_cache_max_clips: 16
    traj_image_size: [224, 224]
    compute_pixel_goal: true
    compute_pano_view_pixel_goal: false
    load_lookdown_for_system2: true
    system2_sft_protocol: internnav
    structured_pano_output: false
    pixel_goal_direction: front_down
    load_history_heatmap: true
    require_sft_target: true
    sft_include_turns: false
    sft_include_forward: false
    sft_num_future_steps: 4
    system2_sample_step: 1
    system2_min_pixel_goal_len: 3
    system2_stop_oversample: 0
    include_stop_samples_random_subsequence: false
    panoramic_vlm_input: false
    trajectory_target_convention: internnav_habitat
    max_clips: 0
    future_heatmap:
      enabled: true
      heatmap_size: [64, 64]

model:
  type: vln_pipeline
  device: cuda
  llm:
    model_path: $INTERNNAV_MODEL_PATH
    backbone_type: qwen2_5_vl
    hidden_dim: 3584
    token_dim: 896
    torch_dtype: bfloat16
    attn_implementation: sdpa
    max_video_frames: -1
    gradient_checkpointing: false
    enable_packing: false
    max_seq_length: 8192
    spatial_merge_size: 2
    use_lora: false
    frozen_traj_inference_mode: true
    traj_last_hidden_state_only: false
  heatmap:
    enable: true
    input_mode: internnav_single_view
    feature_source: vit_only
    architecture_id: internnav_single_view_vision_only_four_direction_v2
    output_direction_order: [front, right, back, left]
    history_pose_convention: habitat_c2w_minus_z__forward_left_cos_yaw_sin_yaw__v1
    c_vit: 1280
    c_llm: 3584
    c_fused: 256
    vit_layer_indices: [7, 15, 23, 31]
    llm_layer_indices: []
    heatmap_size: [64, 64]
    image_size: 384
    heatmap_trains_backbone: false
    decoder_mode: legacy
    restore_vit_spatial_layout: true
    coarse_logit_residual: false
    joint_panorama_inference: true
    conditioner_global_context: true
    trajectory:
      enable: true
      num_freqs: 16
      d_attn: 256
      num_heads: 4
      num_layers: 2
      max_spatial_range: 10.0
  action_head:
    enable: true
    nextdit:
      enabled: true
      internnav_model_path: $INTERNNAV_MODEL_PATH
      internnav_system1_path: ""
      pretrained_system1_path: null
      vlm_hidden_dim: 3584
      latent_emb_size: 768
      n_query: 4
      dit_dim: 384
      dit_layers: 12
      dit_heads: 6
      dit_kv_heads: 6
      dit_ffn_dim_multiplier: 0.6666666666666666
      predict_steps: 32
      action_dim: 3
      num_inference_steps: 10
      guidance_scale: 1.0
      num_sample_trajs: 32
      dav2_ckpt_path: ""
      enable_gradient_checkpointing: false
      warmup_steps: 0
      heatmap_control:
        enabled: false
  past_plan_action:
    enabled: true
    schema_version: past-plan-action-v1
    plan_dim: 768
    memory_dim: 256
    bridge_heads: 8
    # Hard trust region: per-token ||delta|| <= 5% of the native ||plan_z0||
    # token norm, enforced identically in training and deployment.
    max_delta_ratio: 0.05

training:
  stages:
    - name: ppa_action_refine_v2
      epochs: 3
      hm_size: [64, 64]
      heatmap_loss_type: heatmap_vln
      train_heatmap: true
      train_history: true
      train_future: true
      train_lm: false
      train_system2_sft: false
      train_action: true
      teacher_force_system2_answer: true
      system2_sft_protocol: internnav
      trajectory_sequence_mode: first_only
      strict_trainable_modules: true
      require_complete_internnav_system1: true
      heatmap_fp32: true
      retain_raw_panoramic_views: false
      compute_pano_text_anchor_positions: false
      retain_history_rel_poses: true
      trainable_modules: [past_plan_action, heatmap_vln]
      heatmap_pose_adaptation_init: true
      required_history_pose_provider: amb3r_vo_cache
      past_plan_action_stage: stage2_joint
      past_plan_action_bridge_only: true
      # EXP-10 bridge-off arm: reset the bridge to its exact-zero state, so
      # delta_z is exactly 0 and Plan Z equals the native plan_z0 bitwise.
      # Everything else (heads, data, metrics, 512 rollout pairs) matches the
      # bridge-on arm, which is EXP-09-R's run on the same checkpoint.
      past_plan_action_reset_bridge: true
      frozen_modules:
        - vlm_backbone
        - qwen2_5_vl
        - latent_queries
        - cond_projector
        - memory_encoder
        - rgb_resampler
        - traj_dit
        - action_encoder
        - action_decoder
        - rgb_model
        - pos_encoding
        - llm_projector

optim:
  optimizer: adamw
  learning_rate: 1.0e-5
  past_plan_action_future_lr: 1.0e-6
  past_plan_action_bridge_lr: 1.0e-5
  heatmap_lr: 1.0e-5
  heatmap_coarse_lr: 1.0e-5
  heatmap_fine_lr: 5.0e-6
  weight_decay: 1.0e-2
  grad_clip: 1.0
  amp: bf16
  scheduler: cosine
  warmup_ratio: 0.05
  min_lr: 1.0e-6
  # 8 ranks x 1 sample x 1 accumulation = effective global batch 8.
  batch_size: 1
  grad_accum_steps: 1
  ema_decay: 0.999
  ema_warmup_steps: 500

loss:
  heatmap_loss_type: heatmap_vln
  heatmap_weight: 1.0
  trajectory_weight: 1.0
  # History/Future modules are frozen.  A tiny positive History value keeps
  # the strict map-supervision contract; Future anchors Plan Z in the region
  # the frozen decoder still reads correctly.
  history_weight: 1.0e-8
  future_weight: 0.1
  # v1 measured tax (0.5*preserve + 0.01*delta ~= 12% of the action term) lost
  # the argmin race and the delta drifted monotonically.  v2 makes native
  # preservation dominate and switches the delta penalty to the scale-free
  # per-token ratio so flat directions decay to an exactly silent bridge.
  preserve_weight: 2.0
  delta_z_weight: 10.0
  delta_z_relative: true
  # Only push the bridge where frozen native System1 is actually wrong: scale
  # each sample's action loss by clamp(native_mse/0.125, max=4) under shared
  # noise.  0.125 is the measured native-scale velocity MSE on this data.
  action_advantage_enabled: true
  action_advantage_reference_mse: 0.125
  action_advantage_max_weight: 4.0
  lm_weight: 0.0
  heatmap_vln:
    lambda_vis: 1.0
    lambda_coord: 0.2
    lambda_kl: 0.0
    lambda_peak: 1.0
    lambda_neg: 0.25
    lambda_view_macro: 0.5
    lambda_direction_macro: 0.5
    lambda_panoramic_view: 1.0
    panoramic_detach_visibility: false
    vis_pos_weight: 7.0
    temperature: 1.0
    coord_smooth_l1_beta: 0.1
    allow_probability_fallback: false
  future_heatmap:
    lambda_vis: 1.0
    lambda_peak: 1.0
    lambda_neg: 0.25
    lambda_view_macro: 0.5
    vis_pos_weight: 1.0
    lambda_coord: 0.0
    lambda_direction_macro: 0.0
    lambda_panoramic_view: 0.0
    allow_probability_fallback: false

gpu:
  devices: [0, 1, 2, 3, 4, 5, 6, 7]
  backend: nccl
  multi_gpu:
    enabled: true
    find_unused_parameters: false

log:
  out_dir: $PPA_ACTION_REFINE_OUTPUT_ROOT
  save_every_epochs: 1
  vis_every_steps: 500
  val_vis_batches: 2
  max_ckpts: 3
  use_tensorboard: true
  tensorboard_dir: $PPA_TENSORBOARD_ROOT
  log_interval: 10
  diag_interval: 100
  mid_epoch_save_every: 0
  show_gpu_memory: true

validation:
  enabled: true
  eval_every_epochs: 1
  best_selection_enabled: true
  # Select by what the evaluator executes, not by teacher-forced MSE: mean
  # endpoint error of the deployment-selected sampled path against GT.
  save_best_metric: val_rollout_endpoint_error
  save_best_mode: min
  # EXP-09-R: run with --validate-only; this pass is the whole job.
  evaluate_before_training: true
  baseline_as_best_threshold: false
  patience: 2
  val_inference_batches: 32
  # Sixty-four per-rank rollout batches -> 512 bridged-vs-native sampled pairs
  # (EXP-09-R: re-read the certified v2 checkpoints on the EXP-08/09 scale).
  val_rollout_batches: 64
