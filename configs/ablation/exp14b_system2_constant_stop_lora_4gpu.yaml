# 4-GPU variant of exp14b_system2_constant_stop_lora_8gpu.yaml (2026-09-06): identical except gpu.devices and
# optim.grad_accum_steps (2 -> 4), which keeps the effective global batch at 16.
# EXP-14 control arm: the same prompt, the same tokens, no memory content,
# trained on the same stop-and-turn relabelled data as exp14a.
#
# Derived from configs/ablation/exp14a_system2_memory_stop_lora_4gpu.yaml by
# changing model.system2_memory.mode from `memory` to `constant`, and the stage
# name.  Nothing else differs.  The eight memory tokens are still present, still
# in the same position, still carried by trainable parameters of the same
# shape -- they simply do not depend on M_t.
#
# It exists because a fine-tune on DAgger recovery states could improve the
# policy on its own, with no memory involved at all.  Without this arm any gain
# the treatment shows would be unattributable, which is the mistake EXP-01 had
# to spend EXP-05 undoing.
#
# Every earlier arm injected the Past Head memory into Z, which conditions the
# local controller that walks toward a pixel goal System2 had already chosen.
# EXP-05 and EXP-07 measured the ceiling of that design (closed-loop parity),
# and EXP-12 located the failures one layer up: in recovery states native
# System2 answers "front" and the oracle disagrees, so nothing the bridge does
# to Z can change where the robot goes.
#
# This arm moves the injection point.  M_t becomes eight extra token
# embeddings inside the released InternNav prompt, and System2 is fine-tuned
# with LoRA on sealed DAgger states whose answers are oracle-relabelled (see
# src/data/dagger_system2_sft.py).  System1, both cognition heads and the Plan
# bridge stay frozen and unused.
#
# Its control is configs/ablation/exp13b_system2_constant_lora_8gpu.yaml, which
# differs in exactly one line: model.system2_memory.mode.  Token count, prompt,
# data, LoRA capacity and trainable-parameter budget are identical, so the
# difference between the two arms is the memory content and nothing else.
#
# Run with scripts/train.py --load-weights <v2 best.pth>: the 79-tensor Past
# Head is loaded from it and frozen; nothing else in that checkpoint is used.
# Ledger: docs/experiments/README.md (EXP-14).
seed: 42

paths:
  log_out_dir: $EXP13_OUTPUT_ROOT
  internnav_model_path: $INTERNNAV_MODEL_PATH

data:
  train_split: train
  val_split: val
  image_size: [384, 384]
  init_hm_size: [64, 64]
  num_workers: 2
  pin_memory: true
  prefetch_factor: 2
  shm_bypass: auto
  dataset_type: trajectory_dagger
  use_worker_tokenized_collator: true
  in_order: true

  trajectory_dagger:
    collection_roots:
      - $DAGGER_ROOT_00
      - $DAGGER_ROOT_01
      - $DAGGER_ROOT_02
      - $DAGGER_ROOT_03
    # Train and validation read the same sealed pool; they are separated by
    # scene below, not by collection, because there is only one round.
    val_collection_roots:
      - $DAGGER_ROOT_00
      - $DAGGER_ROOT_01
      - $DAGGER_ROOT_02
      - $DAGGER_ROOT_03
    allow_unsealed_debug: false
    source_types: [dagger_normal, dagger_hard]
    num_history: 8
    verify_tar_sha256: false
    require_lookdown: true
    expected_policy_mode: internnav_native
    expected_policy_fingerprint: $DAGGER_POLICY_FINGERPRINT

  dagger_system2_sft:
    enabled: true
    # EXP-12's per-state oracle directions: one implementation of "which view
    # is the oracle in", shared with D1, D2 and the EXP-13 feature cache.
    oracle_views_jsonl: $EXP13_ORACLE_VIEWS
    max_turns: 4
    # The same 25% scene hash the readout probe holds out, so the probe and
    # this arm report on the same unseen scenes.
    val_scene_pct: 25
    # EXP-14: relabel STOP where the oracle route ends at the goal within this
    # many metres and native kept walking.  The horizon is fixed here before
    # any number is read; stop_oversample is set from the CPU audit's counts,
    # never from a result.  See docs/experiments/README.md (EXP-14).
    stop_supervision: true
    stop_horizon_m: 1.0
    stop_oversample: 1

model:
  type: vln_pipeline
  device: cuda

  llm:
    model_path: $INTERNNAV_MODEL_PATH
    backbone_type: qwen2_5_vl
    hidden_dim: 3584
    token_dim: 896
    torch_dtype: bfloat16
    attn_implementation: sdpa
    max_video_frames: -1
    gradient_checkpointing: true
    enable_packing: false
    max_seq_length: 8192
    spatial_merge_size: 2
    use_lora: true
    lora_rank: 32
    lora_alpha: 64
    lora_layer_indices: [20, 21, 22, 23, 24, 25, 26, 27]
    lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
    lora_dropout: 0.05
    frozen_traj_inference_mode: false
    traj_last_hidden_state_only: false

  # Frozen Past Head, identical to the deployed one; it only has to produce
  # M_t.  Loaded from --load-weights by load_frozen_past_head below.
  heatmap:
    enable: true
    input_mode: internnav_single_view
    feature_source: vit_only
    architecture_id: internnav_single_view_vision_only_four_direction_v2
    output_direction_order: [front, right, back, left]
    history_pose_convention: habitat_c2w_minus_z__forward_left_cos_yaw_sin_yaw__v1
    c_vit: 1280
    c_llm: 3584
    c_fused: 256
    vit_layer_indices: [7, 15, 23, 31]
    llm_layer_indices: []
    heatmap_size: [64, 64]
    image_size: 384
    heatmap_trains_backbone: false
    decoder_mode: legacy
    restore_vit_spatial_layout: true
    coarse_logit_residual: false
    joint_panorama_inference: true
    conditioner_global_context: true
    trajectory:
      enable: true
      num_freqs: 16
      d_attn: 256
      num_heads: 4
      num_layers: 2
      max_spatial_range: 10.0

  # System1 is not built: this stage supervises System2 text only.
  action_head:
    enable: false
    nextdit:
      enabled: false

  past_plan_action:
    enabled: false

  system2_memory:
    enabled: true
    schema_version: system2-memory-v1
    # THE ONLY LINE THAT DIFFERS FROM THE TREATMENT ARM.
    mode: constant
    num_tokens: 8
    memory_dim: 256

training:
  stages:
    - name: exp14b_system2_constant_stop
      epochs: 2
      hm_size: [64, 64]
      heatmap_loss_type: heatmap_vln
      train_heatmap: false
      train_history: false
      train_future: false
      train_lm: true
      train_system2_sft: true
      train_action: false
      teacher_force_system2_answer: true
      system2_sft_protocol: internnav
      strict_trainable_modules: true
      requires_base_checkpoint: false
      require_complete_internnav_system1: false
      retain_raw_panoramic_views: false
      compute_pano_text_anchor_positions: false
      retain_history_rel_poses: true
      # Load exactly the 79-tensor Past Head from --load-weights and freeze it.
      load_frozen_past_head: true
      trainable_modules:
        - lora
        - system2_memory
      frozen_modules:
        - heatmap_vln
        - llm_projector

optim:
  optimizer: adamw
  learning_rate: 1.0e-4
  lora_lr: 1.0e-4
  system2_memory_lr: 1.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  amp: bf16
  scheduler: cosine
  warmup_ratio: 0.05
  min_lr: 1.0e-6
  # 4 ranks x 1 sample x 4 accumulation = effective global batch 16: every
  # optimizer step consumes the same 16-sample window as the 8-GPU arm, so
  # step count, schedule and EMA warm-up are unchanged; only the sharding is.
  batch_size: 1
  grad_accum_steps: 4
  ema_decay: 0.999
  ema_warmup_steps: 500

loss:
  heatmap_loss_type: heatmap_vln
  heatmap_weight: 0.0
  trajectory_weight: 0.0
  lm_weight: 1.0

gpu:
  devices: [0, 1, 2, 3]
  backend: nccl
  multi_gpu:
    enabled: true
    # This trainer all-reduces a whitelist of trainable modules by hand rather
    # than wrapping the model in DDP (scripts/training/distributed.py), and it
    # materialises a zero gradient for any parameter a rank did not use.  The
    # constant arm never reads the projection, so that path is load-bearing
    # here; the flag is kept only so both arms declare the same setting.
    find_unused_parameters: true

log:
  out_dir: $EXP13_OUTPUT_ROOT
  save_every_epochs: 1
  vis_every_steps: 0
  val_vis_batches: 0
  max_ckpts: 3
  use_tensorboard: true
  tensorboard_dir: $EXP13_TENSORBOARD_ROOT
  log_interval: 10
  diag_interval: 200
  mid_epoch_save_every: 0
  show_gpu_memory: true

validation:
  enabled: true
  eval_every_epochs: 1
  best_selection_enabled: true
  save_best_metric: val_lm_loss
  save_best_mode: min
  evaluate_before_training: true
  baseline_as_best_threshold: false
  patience: 2
  val_inference_batches: 0
  val_rollout_batches: 0
