# ================================
# VLN Heatmap Training Configuration
# ================================
# Based on run_training.md specification
# Implements multi-stage training with resolution curriculum

seed: 42

# ================================
# Data Configuration
# ================================
data:
  root: ./data/habitat_vln
  frames_per_clip: 8              # T: Number of frames per clip
  heatmap_per_clip: 4             # K: Number of heatmaps per clip
  image_size: [384, 384]          # Input image size (W, H)
  init_hm_size: [64, 64]          # Initial heatmap size for curriculum learning
  num_workers: 4
  pin_memory: true

# ================================
# Multi-Stage Training
# ================================
training:
  stages:
    # Stage A: Warmup - Train Head + Renderer only (BASELINE)
    - name: warmup_head
      epochs: 3                     # Baseline: 3 epochs for Stage-A
      freeze_llm: true              # Freeze backbone
      lora: false                   # No LoRA in warmup
      hm_size: [64, 64]             # Start with 64x64 resolution

    # Stage B: Finetune - Unfreeze with LoRA
    - name: finetune_all
      epochs: 8
      freeze_llm: false             # Unfreeze backbone
      lora: true                    # Enable LoRA
      lora_rank: 16
      hm_size: [128, 128]           # Increase to 128x128

    # Stage C: High-res finetuning
    - name: finetune_all_highres
      epochs: 10
      freeze_llm: false
      lora: true
      lora_rank: 16
      hm_size: [224, 224]           # Final 224x224 resolution

# ================================
# Optimization
# ================================
optim:
  optimizer: adamw
  head_lr: 3.0e-3                   # Baseline: Higher LR for head/renderer
  lora_lr: 5.0e-5                   # Learning rate for LoRA/backbone
  weight_decay: 1.0e-2              # Only for backbone; Head/Renderer use 1e-4/0 in param groups
  grad_clip: 1.0
  amp: off                          # Baseline: Disable AMP for stability
  scheduler: cosine
  warmup_ratio: 0.05
  batch_size: 8                     # Start with small batch for stability
  grad_accum_steps: 1

# ================================
# Loss Configuration
# ================================
loss:
  type: kl_ce                       # Main loss: kl_ce or mse
  focal:
    enabled: false                  # Focal loss (enable if output too flat)
    alpha: 0.25
    gamma: 2.0

# ================================
# Logging and Checkpointing
# ================================
log:
  out_dir: ./outputs
  save_every_epochs: 1              # Save checkpoint every N epochs
  vis_every_steps: 200              # Visualize every N steps
  max_ckpts: 3                      # Keep last N checkpoints
  log_interval: 10                  # Log metrics every N steps

# ================================
# Model Architecture
# ================================
model:
  vision_dim: 1024                  # Vision backbone output dimension
  agg: mean                         # Temporal aggregation: mean or gru
  models_root: ./models             # Path to model weights

# ================================
# Distributed Training (Optional)
# ================================
distributed:
  backend: nccl
  find_unused_parameters: true