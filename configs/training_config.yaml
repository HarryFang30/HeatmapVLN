# ================================
# VLN Heatmap Training Configuration
# ================================
# Based on run_training.md specification
# Implements multi-stage training with resolution curriculum

seed: 42

# ================================
# Data Configuration
# ================================
data:
  root: /home/VLN/dataset_train   # NEW: Updated to actual dataset location (absolute path)
  frames_per_clip: 8              # T: Number of frames per clip (model will subsample if needed)
  heatmap_per_clip: 7             # K: Number of heatmaps per clip (NEW: max 7 reference_path points in dataset)
  image_size: [384, 384]          # Input image size (W, H)
  init_hm_size: [64, 64]          # Initial heatmap size for curriculum learning
  num_workers: 4
  pin_memory: true

# ================================
# Multi-Stage Training
# ================================
training:
  stages:
    # Stage A: Warmup - Train Head + Renderer only (BASELINE)
    - name: warmup_head
      epochs: 3                     # Baseline: 3 epochs for Stage-A
      freeze_llm: true              # Freeze backbone
      lora: false                   # No LoRA in warmup
      hm_size: [64, 64]             # Start with 64x64 resolution
      use_gru: false                # No GRU in Stage-A

    # Stage B(1): Enable GRU - Train head+temporal+fuse_proj, backbone still frozen
    - name: warmup_head_gru
      epochs: 3                     # Warmup GRU with frozen backbone
      freeze_llm: true              # Keep backbone frozen
      lora: false                   # No LoRA yet
      hm_size: [64, 64]             # Same resolution
      use_gru: true                 # Enable GRU temporal aggregation

    # Stage B(2): Unfreeze last block - Train all including encoder.layer4+proj
    - name: finetune_lastblock
      epochs: 6                     # Fine-tune with partial unfreezing
      freeze_llm: false             # Unfreeze (only layer4+proj by code logic)
      lora: false                   # No LoRA (using partial unfreezing instead)
      hm_size: [64, 64]             # Same resolution
      use_gru: true                 # Keep GRU enabled

    # Stage B(3): Continue fine-tuning to push below 8.0
    - name: finetune_lastblock_continue
      epochs: 3                     # Continue training 3 more epochs
      freeze_llm: false             # Still only unfreeze layer4+proj
      lora: false
      hm_size: [64, 64]
      use_gru: true

    # Stage C(1): Upscale to 128x128 - Warmup head with frozen backbone
    - name: upscale_128_head
      epochs: 3                     # Adapt to higher resolution with frozen encoder
      freeze_llm: true              # Freeze backbone during resolution upscaling
      lora: false
      hm_size: [128, 128]           # Upscale to 128x128
      use_gru: true                 # Keep GRU enabled

    # Stage C(2): Upscale 128x128 - Fine-tune with partial unfreezing
    - name: upscale_128_lastblock
      epochs: 4                     # Fine-tune at higher resolution
      freeze_llm: false             # Unfreeze layer4+proj
      lora: false
      hm_size: [128, 128]           # Continue at 128x128
      use_gru: true                 # Keep GRU enabled

# ================================
# Optimization
# ================================
optim:
  optimizer: adamw
  head_lr: 2.0e-3                   # Reduced from 3e-3 to prevent overshooting near 8.0
  lora_lr: 1.0e-4                   # Learning rate for encoder layer4+proj (increased from 5e-5)
  weight_decay: 1.0e-2              # Only for backbone; Head/Renderer use 1e-4/0 in param groups
  grad_clip: 1.0
  amp: bf16                         # Stage-B: Enable BF16 AMP
  scheduler: cosine
  warmup_ratio: 0.05
  batch_size: 4                     # Reduced to 4 for 128x128 memory protection
  grad_accum_steps: 1

# ================================
# Loss Configuration
# ================================
loss:
  type: kl_ce                       # Main loss: kl_ce or mse
  focal:
    enabled: false                  # Focal loss (enable if output too flat)
    alpha: 0.25
    gamma: 2.0

# ================================
# Logging and Checkpointing
# ================================
log:
  out_dir: ./outputs
  save_every_epochs: 1              # Save checkpoint every N epochs
  vis_every_steps: 200              # Visualize every N steps
  max_ckpts: 3                      # Keep last N checkpoints
  log_interval: 10                  # Log metrics every N steps

# ================================
# Model Architecture
# ================================
model:
  vision_dim: 1024                  # Vision backbone output dimension
  agg: gru                          # Temporal aggregation: mean or gru (use GRU for Stage-B)
  models_root: ./models             # Path to model weights

# ================================
# Distributed Training (Optional)
# ================================
distributed:
  backend: nccl
  find_unused_parameters: true