seed: 42

# ============================================
# 数据配置
# ============================================
data:
  root: ~/dataset
  train_split: train
  val_split: train  # 暂时用 train 作为验证集（数据集无 val 目录）
  image_size: [224, 224]
  init_hm_size: [64, 64]
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2
  
  # 滑动窗口数据集配置
  dataset_type: sliding_window
  sliding_window:
    min_history: 5
    num_history_sample: 8
    load_depth: true
    cache_poses: true
    sample_stride: 5

# ============================================
# 模型配置
# ============================================
model:
  type: vln_pipeline
  device: cuda

  # Qwen3-VL 配置
  llm:
    model_path: ./models/qwen_3_vl
    hidden_dim: 2048
    token_dim: 1024
    torch_dtype: bfloat16
    attn_implementation: sdpa  # sdpa 无需额外安装 flash_attn
    max_video_frames: 16

  # 热力图头配置 (Diffusion-based dual heads)
  heatmap_head:
    enable_history: true
    enable_future: true
    cond_dim: 512
    num_inference_steps: 10

  # 动作头配置
  action_head:
    enable: true
    cond_dim: 1024
    action_dim: 2
    pred_horizon: 1
    num_diffusion_iters: 10
    encoding_size: 256
    down_dims: [128, 256]
    action_stats_min: [-0.1646, -0.0281]
    action_stats_max: [0.1850, 0.3087]

  # Stop 预测头配置
  stop_head:
    enable: true
    hidden_dim: 512
    focal_gamma: 3.0
    focal_alpha: 0.9

# ============================================
# 训练策略（4 阶段渐进式训练）
# ============================================
training:
  stages:
    # ============ Stage 1: History 预热 (64x64) ============
    - name: warmup_history_64
      epochs: 5                        
      hm_size: [64, 64]
      heatmap_loss_type: simplified
      train_history: true
      train_future: false
      train_action: true
      trainable_modules:
        - history_heatmap_head
        - action_head
        - stop_head
        - llm_projector
      frozen_modules:
        - qwen3_vl
        - future_heatmap_head
      
    # ============ Stage 2: Future 预热 (64x64) ============
    - name: warmup_future_64
      epochs: 5                         
      hm_size: [64, 64]
      heatmap_loss_type: simplified
      train_history: false
      train_future: true
      train_action: true
      trainable_modules:
        - future_heatmap_head
        - action_head
        - stop_head
        - llm_projector
      frozen_modules:
        - qwen3_vl
        - history_heatmap_head
      
    # ============ Stage 3: 联合训练 (128x128) ============
    - name: joint_128
      epochs: 10
      hm_size: [128, 128]
      heatmap_loss_type: nerf_ripple
      train_history: true
      train_future: true
      train_action: true
      trainable_modules:
        - history_heatmap_head
        - future_heatmap_head
        - action_head
        - stop_head
        - llm_projector
      frozen_modules:
        - qwen3_vl
      
    # ============ Stage 4: 精细训练 (224x224) ============
    - name: full_224
      epochs: 20
      hm_size: [224, 224]
      heatmap_loss_type: nerf_ripple
      train_history: true
      train_future: true
      train_action: true
      trainable_modules:
        - history_heatmap_head
        - future_heatmap_head
        - action_head
        - stop_head
        - llm_projector
      frozen_modules:
        - qwen3_vl

# ============================================
# 优化器配置
# ============================================
optim:
  optimizer: adamw
  
  # 分组学习率
  heatmap_lr: 3.0e-4
  history_heatmap_lr: 3.0e-4
  future_heatmap_lr: 3.0e-4
  action_lr: 3.0e-4
  llm_projector_lr: 1.0e-4

  weight_decay: 1.0e-4
  grad_clip: 1.0
  amp: bf16
  scheduler: cosine
  warmup_ratio: 0.1
  batch_size: 2
  grad_accum_steps: 8

# ============================================
# 损失函数
# ============================================
loss:
  heatmap_loss_type: simplified
  
  simplified:
    lambda_mse: 1.0
    lambda_grad: 0.3
    peak_weight: 5.0
  
  nerf_ripple:
    lambda_mse: 1.0
    lambda_fft: 0.3
    lambda_radial: 0.2
    lambda_peak: 1.0
    fft_weight_decay: 0.5
  
  # 各头损失权重
  history_weight: 1.0
  future_weight: 1.0
  action_weight: 1.0
  stop_weight: 0.5

# ============================================
# GPU配置
# ============================================
gpu:
  devices: [0]
  backend: nccl

# ============================================
# 日志与保存
# ============================================
log:
  out_dir: ./outputs/vln_training
  save_every_epochs: 1
  vis_every_steps: 100
  max_ckpts: 3
  use_tensorboard: true
  tensorboard_dir: ./runs
  log_interval: 10
  show_gpu_memory: true
  tqdm_ncols: 120
  log_level: INFO
  diag_interval: 100

# ============================================
# 验证配置
# ============================================
validation:
  eval_every_epochs: 1
  save_best_metric: val_total_loss
  patience: 5
