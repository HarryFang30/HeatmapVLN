seed: 42

# ============================================
# 数据配置
# ============================================
data:
  root: /workspace/r2r_panoramic_data    # 全景R2R数据 (collect_r2r_panoramic.py 采集)
  train_split: train
  val_split: val_unseen
  image_size: [256, 256]
  init_hm_size: [64, 64]
  num_workers: 8
  pin_memory: true
  prefetch_factor: 4
  
  dataset_type: trajectory
  
  sliding_window:
    min_history: 5
    num_history_sample: 32
    load_depth: true
    cache_poses: true
    sample_stride: 2
    clip_level_sampling: true
    samples_per_clip: 30
    val_samples_per_clip: 10
  
  trajectory:
    min_history: 5
    num_history_sample: 8
    load_depth: true
    cache_poses: true
    sample_stride: 2
    clip_level_sampling: true
    samples_per_clip: 30
    val_samples_per_clip: 10
    random_subsequence: true
    min_subsequence_length: 30
    subsequence_samples_per_clip: 5
    predict_horizon: 32
    action_scale: 4.0
    enable_trajectory_augmentation: true
    use_subinstruction: true
    fgr2r_subinstr_path: ./data/fgr2r/subinstr_mapping.json.gz
    load_traj_images: true
    traj_image_size: [224, 224]

# ============================================
# 模型配置
# ============================================
model:
  type: vln_pipeline
  device: cuda

  # Qwen3.5 配置
  llm:
    model_path: ./models/qwen_3.5
    hidden_dim: 4096
    token_dim: 1024
    torch_dtype: bfloat16
    attn_implementation: sdpa
    max_video_frames: -1
    enable_packing: false
    max_seq_length: 8192
    spatial_merge_size: 2

  # HeatmapVLN v2 Coarse-to-Fine 配置
  heatmap:
    enable: true
    c_vit: 1152
    c_llm: 4096
    c_fused: 256
    vit_layer_indices: [6, 12, 18, 24]
    llm_layer_indices: [7, 15, 23]
    heatmap_size: [64, 64]
    image_size: 256
    # 损失权重
    lambda_vis: 1.0
    lambda_coord: 0.2
    lambda_kl: 0.0
    lambda_peak: 1.0

  # 动作头配置
  action_head:
    enable: true
    type: transformer
    
    legacy:
      cond_dim: 1024
      action_dim: 2
      pred_horizon: 1
      num_diffusion_iters: 10
      encoding_size: 256
      down_dims: [128, 256]
      action_stats_min: [-0.1646, -0.0281]
      action_stats_max: [0.1850, 0.3087]
    
    transformer:
      vlm_token_dim: 1024
      n_emb: 384
      predict_size: 24
      n_layer: 16
      n_head: 6
      n_cond_layers: 4
      action_dim: 3
      num_train_timesteps: 20
      p_drop_emb: 0.2
      p_drop_attn: 0.2
      causal_attn: true

    # DualVLN System 1 — NextDiT + Flow Matching + DepthAnythingV2
    nextdit:
      enabled: true
      vlm_hidden_dim: 4096
      latent_emb_size: 768
      n_query: 4
      dit_dim: 384
      dit_layers: 12
      dit_heads: 6
      dit_kv_heads: 6
      predict_steps: 32
      action_dim: 3
      num_inference_steps: 10
      guidance_scale: 1.0
      num_sample_trajs: 32
      dav2_ckpt_path: "models/depth_anything_v2_metric_hypersim_vits.pth"
      pretrained_system1_path: "models/dualvln_system1_pretrained.safetensors"
      enable_gradient_checkpointing: true
      # 分阶段 warmup: 前 N 步只训练 cond_projector + latent_queries (适配层),
      # 之后解冻全部 System 1 模块联合训练
      warmup_steps: 1000

  # Progress 预测头配置
  progress_head:
    enable: true
    hidden_dim: 512
    dropout: 0.3
    concat_state_txt: true

  # Stop 预测头配置（已弃用）
  stop_head:
    enable: false
    hidden_dim: 512
    focal_gamma: 3.0
    focal_alpha: 0.9

# ============================================
# 训练策略
# ============================================
training:
  stages:
    - name: coarse_to_fine_64
      epochs: 10
      hm_size: [64, 64]
      heatmap_loss_type: heatmap_vln
      train_heatmap: true
      train_action: true
      trainable_modules:
        - heatmap_vln          # DPTLiteFusion + FineLocalization (~2M params)
        - nextdit_action_head  # DualVLN System 1 (DiT + MemoryEncoder + QFormer 等)
        - latent_queries       # System 2 → System 1 桥接 (4 个可学习 token)
        - progress_head
        - llm_projector
      frozen_modules:
        - qwen3_5              # 冻结 VLM 全部参数
        - action_head
        - transformer_action_head
        - stop_head

# ============================================
# 优化器配置
# ============================================
optim:
  optimizer: adamw
  learning_rate: 2.0e-4
  heatmap_lr: 2.0e-4
  action_lr: 1.0e-4
  transformer_action_lr: 1.0e-4
  nextdit_action_lr: 1.0e-4          # DiT/MemoryEncoder/QFormer 等核心模块
  nextdit_cond_projector_lr: 3.0e-4  # cond_projector 适配层 (更高 lr 加速收敛)
  latent_queries_lr: 5.0e-4          # latent_queries (更高 lr 加速收敛)
  progress_lr: 1.0e-4
  llm_projector_lr: 1.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  amp: bf16
  scheduler: cosine
  warmup_ratio: 0.1
  warmup_steps: 500
  min_lr: 1.0e-6
  batch_size: 4
  grad_accum_steps: 2

# ============================================
# 损失函数
# ============================================
loss:
  heatmap_loss_type: heatmap_vln
  
  heatmap_vln:
    lambda_vis: 1.0
    lambda_coord: 0.2
    lambda_kl: 0.0
    lambda_peak: 1.0
    temperature: 1.0
    vis_pos_weight: 7.0
    temperature_schedule:
      enabled: false
      mode: cosine
      start: 1.0
      end: 1.0
  
  # 各头损失权重
  heatmap_weight: 1.0
  trajectory_weight: 1.0
  progress_weight: 1.0

# ============================================
# GPU配置
# ============================================
gpu:
  devices: [0]
  backend: nccl
  multi_gpu:
    enabled: false
    find_unused_parameters: false

# ============================================
# 日志与保存
# ============================================
log:
  out_dir: /root/autodl-tmp/vln_training_outputs
  save_every_epochs: 1
  vis_every_steps: 100
  val_vis_batches: 2
  max_ckpts: 3
  use_tensorboard: true
  tensorboard_dir: /root/tf-logs
  log_interval: 10
  show_gpu_memory: true
  tqdm_ncols: 120
  log_level: INFO
  diag_interval: 100
  
  notify:
    enabled: true
    platform: feishu
    webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/60a6d820-9069-4963-8116-46bd68e668aa"

# ============================================
# 验证配置
# ============================================
validation:
  eval_every_epochs: 1
  save_best_metric: val_total_loss
  patience: 5
