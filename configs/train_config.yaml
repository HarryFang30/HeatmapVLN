seed: 42

paths:
  dataset_root: /workspace/r2r_panoramic_data
  log_out_dir: /root/autodl-tmp/vln_training_outputs
  tensorboard_dir: /root/tf-logs

# ============================================
# 数据配置
# ============================================
data:
  train_split: train
  val_split: val_unseen
  image_size: [256, 256]
  init_hm_size: [64, 64]
  num_workers: 8
  pin_memory: true
  prefetch_factor: 4
  
  dataset_type: trajectory
  
  sliding_window:
    min_history: 5
    num_history_sample: 32
    load_depth: true
    cache_poses: true
    sample_stride: 2
    clip_level_sampling: true
    samples_per_clip: 30
    val_samples_per_clip: 10
  
  trajectory:
    min_history: 5
    num_history_sample: 8
    load_depth: true
    cache_poses: true
    sample_stride: 2
    clip_level_sampling: true
    samples_per_clip: 30
    val_samples_per_clip: 10
    random_subsequence: true
    min_subsequence_length: 30
    subsequence_samples_per_clip: 5
    predict_horizon: 32
    action_scale: 4.0
    enable_trajectory_augmentation: true
    use_subinstruction: true
    fgr2r_subinstr_path: ./data/fgr2r/subinstr_mapping.json.gz
    load_traj_images: true
    traj_image_size: [224, 224]

# ============================================
# 模型配置
# ============================================
model:
  type: vln_pipeline
  device: cuda

  # VLM backbone 配置
  llm:
    model_path: ./models/internnav_backbone
    backbone_type: qwen2_5_vl
    hidden_dim: 3584
    token_dim: 896
    torch_dtype: bfloat16
    attn_implementation: sdpa
    max_video_frames: -1
    enable_packing: false
    max_seq_length: 8192
    spatial_merge_size: 2

  # HeatmapVLN v2 Coarse-to-Fine 配置
  heatmap:
    enable: true
    c_vit: 1280
    c_llm: 3584
    c_fused: 256
    vit_layer_indices: [7, 15, 23, 31]
    llm_layer_indices: [6, 13, 20]
    heatmap_size: [64, 64]
    image_size: 256
    # 损失权重
    lambda_vis: 1.0
    lambda_coord: 0.2
    lambda_kl: 0.0
    lambda_peak: 1.0

  # NextDiT System 1 — 与 InternNav 完全一致
  action_head:
    enable: true
    nextdit:
      enabled: true
      vlm_hidden_dim: 3584
      latent_emb_size: 768
      n_query: 4
      dit_dim: 384
      dit_layers: 12
      dit_heads: 6
      dit_kv_heads: 6
      dit_ffn_dim_multiplier: 0.6666666666666666
      predict_steps: 32
      action_dim: 3
      num_inference_steps: 10
      guidance_scale: 1.0
      num_sample_trajs: 32
      dav2_ckpt_path: "models/depth_anything_v2_metric_hypersim_vits.pth"
      internnav_system1_path: "models/internnav_system1.safetensors"
      enable_gradient_checkpointing: true
      warmup_steps: 1000

# ============================================
# 训练策略
# ============================================
training:
  stages:
    - name: coarse_to_fine_64
      epochs: 10
      hm_size: [64, 64]
      heatmap_loss_type: heatmap_vln
      train_heatmap: true
      train_action: true
      trainable_modules:
        - heatmap_vln
        - nextdit_action_head
        - latent_queries
        - cond_projector
        - llm_projector
      frozen_modules:
        - vlm_backbone
        - traj_dit
        - rgb_model
        - memory_encoder
        - rgb_resampler
        - action_encoder
        - action_decoder

# ============================================
# 优化器配置
# ============================================
optim:
  optimizer: adamw
  learning_rate: 2.0e-4
  heatmap_lr: 2.0e-4
  nextdit_cond_projector_lr: 3.0e-4
  latent_queries_lr: 5.0e-4
  llm_projector_lr: 1.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  amp: bf16
  scheduler: cosine
  warmup_ratio: 0.1
  warmup_steps: 500
  min_lr: 1.0e-6
  batch_size: 4
  grad_accum_steps: 2

# ============================================
# 损失函数
# ============================================
loss:
  heatmap_loss_type: heatmap_vln
  
  heatmap_vln:
    lambda_vis: 1.0
    lambda_coord: 0.2
    lambda_kl: 0.0
    lambda_peak: 1.0
    lambda_neg: 1.0
    temperature: 1.0
    vis_pos_weight: 7.0
    temperature_schedule:
      enabled: false
      mode: cosine
      start: 1.0
      end: 1.0
  
  heatmap_weight: 1.0
  trajectory_weight: 1.0

# ============================================
# GPU配置
# ============================================
gpu:
  devices: [0]
  backend: nccl
  multi_gpu:
    enabled: false
    find_unused_parameters: false

# ============================================
# 日志与保存
# ============================================
log:
  save_every_epochs: 1
  vis_every_steps: 100
  val_vis_batches: 2
  max_ckpts: 3
  use_tensorboard: true
  log_interval: 10
  show_gpu_memory: true
  tqdm_ncols: 120
  log_level: INFO
  diag_interval: 100
  
  notify:
    enabled: true
    platform: feishu
    webhook_url: "${FEISHU_WEBHOOK_URL}"

# ============================================
# 验证配置
# ============================================
validation:
  eval_every_epochs: 1
  save_best_metric: val_total_loss
  patience: 5
