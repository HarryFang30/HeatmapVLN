seed: 42

# ============================================
# 数据配置
# ============================================
data:
  root: /root/autodl-tmp/dataset_with_actions
  train_split: train
  val_split: val_unseen
  image_size: [224, 224]
  init_hm_size: [64, 64]
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2
  
  # 滑动窗口数据集配置
  dataset_type: sliding_window
  sliding_window:
    min_history: 5
    num_history_sample: 8
    load_depth: true
    cache_poses: true
    sample_stride: 5
    
    # Clip-level 采样策略（解决样本高度相关性问题）
    # 每个 epoch 从每个 clip 随机选择 N 个样本，而不是使用所有滑动窗口样本
    clip_level_sampling: true  # 启用 clip-level 采样
    samples_per_clip: 2        # 每个 clip 每 epoch 采样 2 个样本（1 个 STOP + 1 个正常）

# ============================================
# 模型配置
# ============================================
model:
  type: vln_pipeline
  device: cuda

  # Qwen3-VL 配置
  llm:
    model_path: ./models/qwen_3_vl
    hidden_dim: 4096
    token_dim: 1024
    torch_dtype: bfloat16
    attn_implementation: sdpa  # sdpa 无需额外安装 flash_attn
    max_video_frames: 16

  # 热力图头配置 (只训练 history head)
  heatmap_head:
    enable_history: true
    enable_future: false  # 禁用 future head 以节省内存
    cond_dim: 512
    num_inference_steps: 10
    # CNN 消融实验开关：设为 false 禁用 ImageConditionEncoder，只用 LLM 特征
    use_image_encoder: true

  # 动作头配置
  action_head:
    enable: true
    cond_dim: 1024
    action_dim: 2
    pred_horizon: 1
    num_diffusion_iters: 10
    encoding_size: 256
    down_dims: [128, 256]
    action_stats_min: [-0.1646, -0.0281]
    action_stats_max: [0.1850, 0.3087]

  # Stop 预测头配置
  stop_head:
    enable: true
    hidden_dim: 512
    focal_gamma: 3.0
    focal_alpha: 0.9

# ============================================
# 训练策略（单阶段全量训练 64x64）
# ============================================
training:
  stages:
    # ============ 单阶段训练 history_head (64x64) ============
    - name: history_only_64
      epochs: 50
      hm_size: [64, 64]
      heatmap_loss_type: simplified
      train_history: true
      train_future: false
      train_action: true
      trainable_modules:
        - history_heatmap_head
        - action_head
        - stop_head
        - llm_projector
      frozen_modules:
        - qwen3_vl
        - future_heatmap_head

# ============================================
# 优化器配置
# ============================================
optim:
  optimizer: adamw

  # 分组学习率 (降低以防止过拟合)
  heatmap_lr: 1.0e-4
  history_heatmap_lr: 1.0e-4
  future_heatmap_lr: 1.0e-4
  action_lr: 1.0e-4
  llm_projector_lr: 3.0e-5

  weight_decay: 1.0e-2  # 增加正则化
  grad_clip: 1.0
  amp: bf16
  scheduler: cosine
  warmup_ratio: 0.1
  
  # 批量配置（每个样本单独过 Qwen3-VL）
  # 110GB RAM，激进配置
  # 有效批量: 32 * 4 = 128
  batch_size: 32
  grad_accum_steps: 4

# ============================================
# 损失函数
# ============================================
loss:
  heatmap_loss_type: simplified
  
  simplified:
    lambda_mse: 1.0
    lambda_grad: 0.3
    peak_weight: 5.0
  
  nerf_ripple:
    lambda_mse: 1.0
    lambda_fft: 0.3
    lambda_radial: 0.2
    lambda_peak: 1.0
    fft_weight_decay: 0.5
  
  # 各头损失权重
  history_weight: 1.0
  future_weight: 1.0
  action_weight: 1.0
  stop_weight: 0.5

# ============================================
# GPU配置
# ============================================
gpu:
  devices: [0]
  backend: nccl

# ============================================
# 日志与保存
# ============================================
log:
  out_dir: /root/autodl-tmp/vln_training_outputs
  save_every_epochs: 1
  vis_every_steps: 100
  max_ckpts: 3
  use_tensorboard: true
  tensorboard_dir: /root/tf-logs
  log_interval: 10
  show_gpu_memory: true
  tqdm_ncols: 120
  log_level: INFO
  diag_interval: 100
  
  # 飞书通知配置
  notify:
    enabled: true
    platform: feishu
    webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/60a6d820-9069-4963-8116-46bd68e668aa"

# ============================================
# 验证配置
# ============================================
validation:
  eval_every_epochs: 1
  save_best_metric: val_total_loss
  patience: 10
