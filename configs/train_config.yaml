seed: 42

# ============================================
# 数据配置
# ============================================
data:
  root: /root/autodl-tmp/dataset_with_actions
  train_split: train
  val_split: val_unseen
  image_size: [224, 224]
  init_hm_size: [64, 64]
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2
  
  # 数据集配置
  # 'sliding_window': 原始滑动窗口数据集（单步动作）
  # 'trajectory': 轨迹数据集（24步轨迹预测，参考 InternNav）
  dataset_type: trajectory
  
  sliding_window:
    min_history: 5
    num_history_sample: 8        # 从历史中均匀采样 8 帧（配合 max_video_frames=16）
    load_depth: true
    cache_poses: true
    sample_stride: 5
    
    # Clip-level 采样策略（解决样本高度相关性问题）
    clip_level_sampling: true
    samples_per_clip: 8
    val_samples_per_clip: 2
  
  # 轨迹数据集配置（参考 InternNav）
  trajectory:
    min_history: 5
    num_history_sample: 8        # 从历史中均匀采样 8 帧（配合 max_video_frames=16）
    load_depth: true
    cache_poses: true
    sample_stride: 5
    clip_level_sampling: true
    samples_per_clip: 8
    val_samples_per_clip: 2
    # 轨迹预测配置
    predict_horizon: 24          # 预测 24 步轨迹
    action_scale: 4.0            # 动作放大 4 倍（参考 InternNav）
    enable_trajectory_augmentation: true  # 启用轨迹增强

# ============================================
# 模型配置
# ============================================
model:
  type: vln_pipeline
  device: cuda

  # Qwen3-VL 配置
  llm:
    model_path: ./models/qwen_3_vl
    hidden_dim: 4096
    token_dim: 1024
    torch_dtype: bfloat16
    attn_implementation: sdpa  # sdpa 无需额外安装 flash_attn
    max_video_frames: 16

  # 热力图头配置 (只训练 history head)
  heatmap_head:
    enable_history: true
    enable_future: false  # 禁用 future head 以节省内存
    cond_dim: 512
    num_inference_steps: 10
    # CNN 消融实验开关：设为 false 禁用 ImageConditionEncoder，只用 LLM 特征
    use_image_encoder: false
    # LLM token pooling 方式：'attention' (推荐) 或 'mean', 'first', 'last', 'max'
    # attention pooling 更好地保留空间信息，比 mean pooling 效果更好
    pool_method: attention
    pool_num_heads: 4

  # 动作头配置
  action_head:
    enable: true
    # 动作头类型：'legacy' (UNet1D) 或 'transformer' (InternNav style)
    type: transformer
    
    # Legacy (DiffusionActionHead) 配置 - 仅当 type: legacy 时使用
    legacy:
      cond_dim: 1024
      action_dim: 2
      pred_horizon: 1
      num_diffusion_iters: 10
      encoding_size: 256
      down_dims: [128, 256]
      action_stats_min: [-0.1646, -0.0281]
      action_stats_max: [0.1850, 0.3087]
    
    # Transformer (InternNav style) 配置 - 仅当 type: transformer 时使用
    transformer:
      vlm_token_dim: 1024        # VLM 输出维度
      n_emb: 384                 # 内部嵌入维度 (原 token_dim)
      predict_size: 24           # 预测 24 步轨迹
      n_layer: 16                # Transformer Decoder 层数 (原 temporal_depth)
      n_head: 8                  # 注意力头数 (原 heads)
      n_cond_layers: 4           # 条件编码器层数 (参考 InternNav)
      action_dim: 3              # 动作维度 (dx, dy, delta_yaw)
      num_train_timesteps: 20    # 扩散训练步数
      action_scale: 4.0          # 动作放大倍数
      p_drop_emb: 0.1            # Embedding dropout
      p_drop_attn: 0.1           # Attention dropout
      causal_attn: true          # 使用因果注意力

  # Progress 预测头配置（替代 Stop Head）
  progress_head:
    enable: true
    hidden_dim: 512
    dropout: 0.1

  # Stop 预测头配置（已弃用，使用 progress_head 替代）
  stop_head:
    enable: false
    hidden_dim: 512
    focal_gamma: 3.0
    focal_alpha: 0.9

# ============================================
# 训练策略（单阶段训练）
# ============================================
training:
  stages:
    - name: history_only_64
      epochs: 30  # 配合 samples_per_clip=8，30 epochs 足够
      hm_size: [64, 64]
      heatmap_loss_type: simplified
      train_history: true
      train_future: false
      train_action: true
      trainable_modules:
        - history_heatmap_head
        - transformer_action_head  # 新的 Transformer 动作头
        - progress_head            # 新的进度预测头
        - llm_projector
      frozen_modules:
        - qwen3_vl
        - future_heatmap_head
        - action_head              # Legacy action head（如果存在）
        - stop_head                # Legacy stop head

# ============================================
# 优化器配置
# ============================================
optim:
  optimizer: adamw

  # 分组学习率 (降低以防止过拟合)
  heatmap_lr: 1.0e-4
  history_heatmap_lr: 1.0e-4
  future_heatmap_lr: 1.0e-4
  action_lr: 1.0e-4
  llm_projector_lr: 3.0e-5

  weight_decay: 1.0e-2  # 增加正则化
  grad_clip: 1.0
  amp: bf16
  scheduler: cosine
  warmup_ratio: 0.1
  
  # 批量配置（每个样本单独过 Qwen3-VL）
  # RTX 5090 32GB 显存优化配置
  # 当前 20GB 用 batch_size=32，32GB 可支持 ~50-56
  # 有效批量: 56 * 2 = 112
  batch_size: 56
  grad_accum_steps: 2

# ============================================
# 损失函数
# ============================================
loss:
  heatmap_loss_type: simplified
  
  simplified:
    lambda_mse: 1.0
    lambda_grad: 0.3
    peak_weight: 5.0
  
  nerf_ripple:
    lambda_mse: 1.0
    lambda_fft: 0.3
    lambda_radial: 0.2
    lambda_peak: 1.0
    fft_weight_decay: 0.5
  
  # 各头损失权重
  history_weight: 1.0
  future_weight: 1.0
  action_weight: 1.0        # Legacy action head
  trajectory_weight: 1.0    # Transformer action head (24 step trajectory)
  progress_weight: 0.5      # Progress prediction head
  stop_weight: 0.5          # Legacy stop head (disabled)

# ============================================
# GPU配置
# ============================================
gpu:
  devices: [0]
  backend: nccl

# ============================================
# 日志与保存
# ============================================
log:
  out_dir: /root/autodl-tmp/vln_training_outputs
  save_every_epochs: 1
  vis_every_steps: 100
  max_ckpts: 3
  use_tensorboard: true
  tensorboard_dir: /root/tf-logs
  log_interval: 10
  show_gpu_memory: true
  tqdm_ncols: 120
  log_level: INFO
  diag_interval: 100
  
  # 飞书通知配置
  notify:
    enabled: true
    platform: feishu
    webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/60a6d820-9069-4963-8116-46bd68e668aa"

# ============================================
# 验证配置
# ============================================
validation:
  eval_every_epochs: 1
  save_best_metric: val_total_loss
  patience: 10
