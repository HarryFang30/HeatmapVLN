services:
  heatmapvln:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: heatmapvln:latest
    container_name: heatmapvln
    volumes:
      - ../models:/workspace/HeatmapVLN/models
      - ${DATA_ROOT:-/workspace/r2r_panoramic_data}:/workspace/r2r_panoramic_data
      - ${OUT_DIR:-/workspace/vln_training_outputs}:/workspace/vln_training_outputs
      - ${TB_DIR:-/workspace/tf-logs}:/workspace/tf-logs
    ports:
      - "6006:6006"
    stdin_open: true
    tty: true
    shm_size: '8gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      /bin/bash -c "source /root/miniconda3/etc/profile.d/conda.sh &&
      conda activate models && exec bash"

  tensorboard:
    image: heatmapvln:latest
    container_name: heatmapvln-tensorboard
    volumes:
      - ${TB_DIR:-/workspace/tf-logs}:/workspace/tf-logs
    ports:
      - "6007:6006"
    command: >
      /bin/bash -c "source /root/miniconda3/etc/profile.d/conda.sh &&
      conda activate models &&
      tensorboard --logdir=/workspace/tf-logs --host=0.0.0.0 --port=6006"
