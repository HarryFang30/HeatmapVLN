[project]
name = "heatmapvln"
version = "0.1.0"
description = "Vision-Language Navigation with Coarse-to-Fine Heatmap Generation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jialei Fang" }]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

# ============================================
# Ruff — unified linter + formatter
# ============================================
[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "scripts"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function call in argument defaults
    "B905",   # zip() without strict=
    "SIM108", # use ternary operator
    "UP007",  # use X | Y for union types (keep Optional for readability)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports are re-exports
"scripts/training/__init__.py" = ["F401"]

# ============================================
# Mypy — gradual type checking
# ============================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "src.utils.*"
check_untyped_defs = true

# ============================================
# Pytest
# ============================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
