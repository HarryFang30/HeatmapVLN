name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ scripts/ tests/

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch
        run: pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install test dependencies
        run: |
          pip install numpy==1.26.4 PyYAML scipy opencv-python-headless Pillow pydantic psutil tqdm pytest pytest-cov
      - name: Run tests
        run: pytest tests/ -x --tb=short -q
